name: Ryu for GitHub
description: Connect GitHub Actions to a self-hosted or managed Ryu Core node.
author: A Major Pte. Ltd.

inputs:
  target:
    description: "Node target mode: auto, self-hosted, or managed."
    required: false
    default: auto
  node-url:
    description: "Ryu Core node URL. Falls back to RYU_CORE_URL."
    required: false
  node-token:
    description: "Ryu Core bearer token. Falls back to RYU_CORE_TOKEN."
    required: false
  managed-node-url:
    description: "Managed Ryu Core node URL. Falls back to RYU_MANAGED_NODE_URL."
    required: false
  managed-node-token:
    description: "Managed Ryu Core bearer token. Falls back to RYU_MANAGED_NODE_TOKEN."
    required: false
  operation:
    description: "Action operation: setup, run, tool, or eval."
    required: false
    default: setup
  prompt:
    description: "Prompt to send when operation is run."
    required: false
  agent:
    description: "Saved Ryu agent id for a run or eval, or the required allowlist for a tool call."
    required: false
  team:
    description: "Saved Ryu team id for a run. Mutually exclusive with agent/workflow."
    required: false
  workflow:
    description: "Saved Ryu workflow id for a run. Mutually exclusive with agent/team."
    required: false
  tool:
    description: "Fully-qualified Ryu/MCP tool id for a tool operation."
    required: false
  tool-arguments:
    description: "JSON arguments sent to the direct tool call."
    required: false
    default: "{}"
  user-id:
    description: "Optional Composio entity/audit user id for a direct tool call."
    required: false
  conversation-id:
    description: "Existing conversation id; a UUID is generated for a run when omitted."
    required: false
  persist:
    description: "Persist a run to the node conversation store."
    required: false
    default: "false"
  enable-long-term:
    description: "Enable long-term memory for a run."
    required: false
    default: "false"
  inference:
    description: "JSON object of per-run inference overrides."
    required: false
  plugin-flags:
    description: "JSON object of per-run Ryu plugin flags."
    required: false
  cwd:
    description: "Optional working directory visible to a local Core node."
    required: false
  worktree-isolation:
    description: "Ask Core to isolate the run in a git worktree when cwd is set."
    required: false
    default: "false"
  eval-dataset:
    description: "Runner-relative eval dataset file (JSON, JSONL, or CSV) for the eval operation. The Gateway's built-in dataset is used when omitted."
    required: false
  eval-model:
    description: "Model the eval dataset is replayed against. Defaults to the Gateway's configured eval model."
    required: false
  eval-judge-model:
    description: "Judge model for model-graded eval assertions and evaluators."
    required: false
  eval-scorers:
    description: "Comma- or newline-separated Gateway evaluator ids (or overall, assertions, policy, substring, latency) to score and gate."
    required: false
  eval-threshold:
    description: "Comma- or newline-separated minimums: a bare number applies to every eval-scorer (or overall when none), scorer=n sets one. The job fails below any threshold."
    required: false
  eval-junit-file:
    description: "Optional runner-relative path for a JUnit XML eval report."
    required: false
  timeout-ms:
    description: "Per-request timeout in milliseconds."
    required: false
    default: "600000"
  response-file:
    description: "Optional runner-relative file path for the response text."
    required: false
  export-env:
    description: "Export validated node variables to later workflow steps."
    required: false
    default: "true"
  write-summary:
    description: "Write a metadata-only report to GITHUB_STEP_SUMMARY."
    required: false
    default: "true"
  secrets:
    description: "Newline-separated Ryu Vault values to export as masked environment variables: NAME, /folder/NAME, ENV:NAME, or ENV:/folder/NAME. Requires vault-role-id/vault-secret-id or vault-jwt-identity."
    required: false
  vault-role-id:
    description: "AppRole role id of a Ryu Vault machine identity (with vault-secret-id)."
    required: false
  vault-secret-id:
    description: "AppRole secret id of a Ryu Vault machine identity (with vault-role-id)."
    required: false
  vault-jwt-identity:
    description: "Ryu Vault machine identity that accepts this job's GitHub OIDC token. The job needs permissions id-token write."
    required: false
  vault-jwt-audience:
    description: "Audience requested for the GitHub OIDC token used with vault-jwt-identity."
    required: false

outputs:
  response:
    description: "Assistant text or direct tool output as text."
  result-json:
    description: "Normalized operation result as JSON."
  node-url:
    description: "Validated Ryu Core node URL."
  node-managed:
    description: "Whether the validated node reports managed=true."
  node-version:
    description: "Ryu version reported by the node."
  node-channel:
    description: "Ryu release channel reported by the node."
  health-json:
    description: "Validated /api/health payload as JSON."
  node-info-json:
    description: "Validated /api/system/info payload as JSON."
  conversation-id:
    description: "Conversation id used by a run."
  run-id:
    description: "Run id reported by Core stream frames, when available."
  tool-calls:
    description: "Tool input/output events observed during a run as JSON."
  vault-secrets:
    description: "JSON array of the environment variable names exported from Ryu Vault (never values)."
  eval-passed:
    description: "Whether every eval threshold passed (true or false)."
  eval-json:
    description: "The Gateway eval run with its threshold gate as JSON."

runs:
  using: node20
  main: packages/github-action/dist/action.cjs

branding:
  icon: cpu
  color: purple
