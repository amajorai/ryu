name: release

# ─────────────────────────────────────────────────────────────────────────────
# THERE ARE TWO `release.yml` FILES. THIS IS THE PUBLIC-MIRROR ONE, AND IT IS NOT
# THE PIPELINE A REAL RELEASE GOES THROUGH.
#
#   this file  → published into public `amajorai/ryu`; fires only on a `v*` tag
#                pushed DIRECTLY to the public repo (rare), or a manual dispatch.
#                Builds cli/tui, desktop, island, core, gateway.
#   private `.github/workflows/release.yml` (ryu-closed) → the authoritative
#                producer; `mirror-releases.yml` copies its hub assets here.
#
# They are NOT copies and must not be kept in sync job-for-job: this repo lacks
# `apps/ghost`, `apps/shadow` and `apps-store/*`, so a tag pushed here yields no
# app sidecar bins. Do not copy the private `binaries` job here. Tag the private
# repo for the complete train. Asset naming, the standalone-manifest build, and
# the rest of the rationale: .github/scripts/README.md ("Two release.yml files")
# and docs/RELEASING.md §2 in the private repo.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.0.5)"
        required: true

permissions:
  contents: write
  id-token: write          # OIDC token for artifact attestation
  attestations: write      # gh attestation

# A mirror push and a manual dispatch for the same tag used to leave two full
# release matrices competing for the tiny public macOS pool. Keep one authoritative
# run per tag; a newer dispatch cancels the stale queued matrix instead of making a
# release wait hours behind work that can no longer publish anything useful.
concurrency:
  group: public-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Guard: the tag MUST match the version in the mirrored source ─────────────
  # Tauri names installers from the SOURCE version, not the tag, and the mirror
  # lags the private repo, so a tag pushed before the bump mirrors would ship the
  # previous build under the new number (v0.0.12 did). Fail fast; re-run once the
  # bump has mirrored. Full history in .github/scripts/version-guard.sh.
  version-guard:
    name: Tag matches source version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal tauri.conf.json version
        # Through `env:`, never interpolated into `run:` — a tag name is
        # caller-supplied text and can carry shell metacharacters.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash .github/scripts/version-guard.sh

  # Comes FIRST so the release exists before any binary is attached to it:
  # banner + public-safe AI changelog, created as a PRERELEASE until `promote`.
  # See .github/scripts/stable-release-notes.sh.
  notes:
    needs: version-guard
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog diffs against the previous tag — needs full history.
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Generate + publish standardized notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: deepseek-v4.1-flash
          OPENCODE_MAX_TOKENS: "16000"
          AI_NOTES_BATCH_SIZE: "20"
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        run: bash .github/scripts/stable-release-notes.sh

  # apps/cli is the terminal client (Bun, shipped as `ryu-cli-*`). It must be
  # compiled NATIVELY on each OS, so one job per OS with no cross-targets; see
  # .github/scripts/compile-tui.sh for why and for the asset-name contract.
  tui:
    needs: notes
    name: ryu-cli / tui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; macos-15-intel builds the Intel Mac assets.
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Compile
        shell: bash
        run: bash .github/scripts/compile-tui.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/ryu-cli-*
      # gh release upload (assets endpoint), NOT softprops; an empty dist/ fails
      # the job. See .github/scripts/upload-release-assets.sh for why.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist fail "no files in dist/ to upload"

  # Desktop installers, built on free public runners (source-available here).
  # Signing is OPTIONAL and secret-gated by TAURI_SIGNING_PRIVATE_KEY; see
  # .github/scripts/README.md ("Desktop signing is optional").
  desktop:
    needs: notes
    name: desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # SECURITY: `bun install` stays a separate step with NO signing key in env,
      # so a dependency postinstall cannot read TAURI_SIGNING_PRIVATE_KEY. Residual
      # risk in .github/scripts/README.md ("Signing-key scope during bun install").
      - run: bun install
      # Stamp the channel into productName and the icon. Must run AFTER `bun
      # install` and BEFORE tauri-action; see .github/scripts/README.md
      # ("Channel branding order").
      - name: Brand the bundle for its release channel
        shell: bash
        run: node scripts/release/channel-brand.mjs
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Windows Vite bundle peaks above 8 GB on the full public tree.
          NODE_OPTIONS: ${{ matrix.platform == 'windows-latest' && '--max-old-space-size=12288' || '--max-old-space-size=8192' }}
          # Vite INLINES these; apps/desktop/.env is gitignored, so without them a
          # released build bakes the localhost fallbacks and cannot sign in.
          VITE_APP_BACKEND_URL: ${{ vars.VITE_APP_BACKEND_URL || 'https://api.ryuhq.com' }}
          VITE_APP_FRONTEND_URL: ${{ vars.VITE_APP_FRONTEND_URL || 'https://ryuhq.com' }}
          VITE_APP_WEB_URL: ${{ vars.VITE_APP_WEB_URL || 'https://ryuhq.com' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        with:
          projectPath: apps/desktop
          # NO tagName/releaseName: those make tauri-action publish to the release
          # itself, which 403s for GITHUB_TOKEN. Build only; upload is below.
          args: ${{ matrix.args }}
      # Copy the bundles out, stamp the arch into the macOS updater bundle, and
      # rename by the artifact-name rule BEFORE attestation, so the attested names
      # are the published ones. Shared with the rolling canary/nightly workflows;
      # see .github/scripts/collect-desktop-installers.sh for the full rationale.
      - name: Collect desktop installers
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
        run: bash .github/scripts/collect-desktop-installers.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-desktop/*
      # gh release upload (assets endpoint), NOT softprops; an empty dist-desktop/
      # fails the job. See .github/scripts/upload-release-assets.sh.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist-desktop fail "no desktop installers to upload"

  # Island companion (Electron). Same rationale as desktop: source-available here,
  # so it builds on free public runners.
  island:
    needs: notes
    name: island (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is pinned to windows-2022 (VS2022), NOT windows-latest (VS2026
        # only), or node-gyp finds no toolchain; see .github/scripts/README.md.
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # uiohook-napi compiles libuiohook from source on Linux and needs the X11
      # headers; how the set was derived is in .github/scripts/README.md.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxt-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxkbfile-dev libxrandr-dev libxi-dev libxcursor-dev libxss-dev
      - run: bun install
      # `build` only runs electron-vite; `dist` is the one that packages installers
      # via electron-builder. --publish never: the upload step below owns that, so
      # electron-builder never needs a token or races the release.
      - name: Package Island
        working-directory: apps/island
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The full renderer bundle peaks above Node's default heap on macOS.
          NODE_OPTIONS: --max-old-space-size=8192
          # Matches the windows-2022 image pinned above. On the default
          # windows-latest (VS2026) node-gyp finds no 2022 toolchain and fails.
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
        run: bun run dist -- --publish never
      - name: Collect installers
        shell: bash
        run: bash .github/scripts/collect-island-installers.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-island/*
      # gh release upload (assets endpoint), NOT softprops; an empty dist-island/
      # fails the job. See .github/scripts/upload-release-assets.sh.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist-island fail "no island installers to upload"

  build:
    needs: notes
    name: ${{ matrix.target.asset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Guard for vendored CMake builds, as in .cargo/config.toml: CMake >= 4.0
    # (current runner images) refuses a project whose cmake_minimum_required is
    # below 3.5 unless this is set. Opus no longer needs it: opus 0.4 builds its
    # bundled libopus through opusic-sys, whose CMakeLists requires CMake >= 3.16.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; macos-15-intel builds the Intel Mac assets.
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        target:
          # headless trio (standalone [package] manifests under apps/)
          - { asset: ryu-core,       bin: ryu-core,       dir: apps/core,    features: "sandbox-wasmtime,voice-parakeet,voice-vad" }
          - { asset: ryu-gateway,    bin: ryu-gateway,    dir: apps/gateway }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # pkg-config + libssl-dev for openssl-sys, libdbus-1-dev / dbus for
      # libdbus-sys. No system libopus: opus 0.4 (opusic-sys, default `bundled`)
      # compiles libopus from source with CMake and links it statically, so
      # ryu-core needs no libopus to build or to run.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install dbus pkg-config

      - name: Install protoc (prost-build)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ matrix.target.dir }}

      # Core MUST carry its shipped-but-not-default features (`sandbox-wasmtime`,
      # `voice-parakeet`, `voice-vad`); the flag lives on the matrix row because
      # `ryu-gateway` declares none of them. Rationale, and where every ryu-core
      # build site is listed, in .github/scripts/build-cargo-target.sh.
      - name: Build
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          FEATURES: ${{ matrix.target.features }}
        run: bash .github/scripts/build-cargo-target.sh

      # Feature-set gate: asserts what cargo actually BUILT, read from the
      # fingerprint's `features` key (never `declared_features`, which passes on
      # any build). See .github/scripts/assert-feature-set.sh.
      - name: Assert the shipped feature set was actually built
        if: matrix.target.features != ''
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          TARGET_BIN: ${{ matrix.target.bin }}
          FEATURES: ${{ matrix.target.features }}
        run: bash .github/scripts/assert-feature-set.sh

      # Asset `<asset>-<os>-<arch>[.exe]` + `.sha256`; macOS arch from `uname -m`
      # (macos-15 is Apple Silicon, macos-15-intel x86_64).
      - name: Package
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          TARGET_BIN: ${{ matrix.target.bin }}
          TARGET_ASSET: ${{ matrix.target.asset }}
        run: bash .github/scripts/package-binary.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/ryu-*

      # gh release upload (assets endpoint), NOT softprops; an empty dist/ fails
      # the job. See .github/scripts/upload-release-assets.sh.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist fail "no files in dist/ to upload"

  # ── Updater feed ────────────────────────────────────────────────────────────
  # Assembles `latest.json` (and its `latest-beta.json` copy) from the signed
  # artifacts the desktop job uploaded; without it the app can never self-update.
  # It cannot be part of the desktop job: that job is a MATRIX, and the feed needs
  # every platform's artifact present. `if: always()` is deliberate: one platform
  # failing should still publish a feed for the platforms that did build. See
  # .github/scripts/stable-updater-feed.sh.
  updater-feed:
    needs: desktop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble and publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash .github/scripts/stable-updater-feed.sh

  # Flip the release from prerelease to stable — the LAST thing that happens.
  # `notes` creates it as a prerelease so it never answers `releases/latest`
  # mid-build (see .github/scripts/stable-release-notes.sh). `needs` without `if:`
  # means one failed or cancelled build leaves it a prerelease: the safe state,
  # downloadable but not served to install.sh or the updater as stable. The build
  # jobs are listed explicitly because `updater-feed` runs `if: always()` and so
  # succeeds even when `desktop` failed.
  promote:
    needs: [notes, tui, desktop, island, build, updater-feed]
    runs-on: ubuntu-latest
    steps:
      - name: Promote prerelease to stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Load-bearing: this job has NO checkout, so without GH_REPO every `gh`
          # call dies "fatal: not a git repository". v0.1.10 built all 41 assets
          # green and then sat as a PRERELEASE, invisible to install.sh,
          # install.ps1 and Core's stable updater, because of exactly this.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Ghost and Shadow are satellite-owned assets, so this gate validates
          # only the hub's own build outputs before promoting the release.
          echo "All hub build jobs green — promoting $TAG to stable."
          gh release edit "$TAG" --prerelease=false --latest
          gh release view "$TAG" --json tagName,isPrerelease,isDraft \
            --jq '"promoted: \(.tagName) prerelease=\(.isPrerelease) draft=\(.isDraft)"'
