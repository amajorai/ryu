name: images

# Builds the hosted Core and Gateway container images and pushes them to GHCR, so
# the production host only PULLS them instead of compiling Rust next to the live
# services. This runs here, in the public hub, because Actions minutes are free on
# public repositories; the private monorepo builds only images whose source is
# not published.
#
# The binaries are compiled on the runner with a persistent cargo cache, then
# packaged by the `prebuilt` target of the root Dockerfile and
# apps/gateway/Dockerfile. A change therefore recompiles incrementally, instead
# of the ~34-minute cold in-Docker compile the default target does. Gateway is
# compiled once and goes into both images.
#
# Each image is built locally first and every binary in it is started once. Only
# then are the tags pushed and the deploy hooks called, so `latest` never points
# at an image that cannot start. Pushing and redeploying happen only on main: a
# manual run on any other branch is a dry run that builds and starts the images
# and publishes nothing.
#
# Published:
#   ghcr.io/<owner>/ryu-core:latest     and :<commit sha>
#   ghcr.io/<owner>/ryu-gateway:latest  and :<commit sha>
#
# Optional redeploy: set the repository secrets CORE_DEPLOY_HOOK_URL and/or
# GATEWAY_DEPLOY_HOOK_URL to the Dokploy app's deploy webhook URL (plus
# CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET when Cloudflare Access fronts it).
# A webhook redeploys only its own app, so no general deploy credential is stored
# here. Without them the images are still pushed and nothing is redeployed.

on:
  push:
    branches: [main]
    paths:
      - "apps/core/**"
      - "apps/gateway/**"
      - "crates/**"
      - "vendor/**"
      - "generated/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "config/node-config.example.json"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push Core + Gateway images
    # Never from a fork: this job pushes images and may trigger a redeploy.
    if: github.repository_owner == 'amajorai'
    # A FIXED label, never ubuntu-latest. The binaries are linked on this runner
    # and run in debian:trixie-slim (glibc 2.41), so the runner's glibc must not
    # be newer than 2.41, and it must be at least 2.38 for the prebuilt ONNX
    # Runtime that `voice-parakeet` links (see the root Dockerfile). Ubuntu 24.04
    # has 2.39. On 26 Nov 2026 ubuntu-latest had moved to 26.04 (glibc 2.43) and
    # the Core image built here could not start. Change this label only together
    # with the runtime base of both Dockerfiles, RUNTIME_GLIBC and the cache key
    # below.
    runs-on: ubuntu-24.04
    env:
      # glibc of debian:trixie-slim, the runtime base of the root Dockerfile and
      # apps/gateway/Dockerfile. No binary may need a newer one.
      RUNTIME_GLIBC: "2.41"
      # Same guard as canary.yml for vendored CMake builds on CMake >= 4.0.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Keep in step with the root Dockerfile's `builder` stage and canary.yml.
      CORE_FEATURES: sandbox-wasmtime,voice-parakeet,voice-vad
      # Optional compile-time Marketplace verifying key (see the root Dockerfile).
      RYU_MARKETPLACE_PUBLIC_KEY: ${{ vars.RYU_MARKETPLACE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Install protoc (prost-build)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/core
            apps/gateway
          # The action's own key names the OS family only ("Linux"), not the
          # runner image. Without this, a target directory compiled on another
          # Ubuntu release (C objects built against its glibc headers) would be
          # restored here. Keep it equal to runs-on.
          key: ubuntu-24.04
          cache-on-failure: true

      - name: Build Gateway
        run: cargo build --locked --release --manifest-path apps/gateway/Cargo.toml

      - name: Build Core
        run: cargo build --locked --release --manifest-path apps/core/Cargo.toml --features "$CORE_FEATURES"

      # Asserts what cargo actually BUILT, as canary.yml does: a Core missing a
      # shipped feature degrades silently at runtime.
      - name: Assert Core's shipped feature set was built
        env:
          TARGET_DIR: apps/core
          TARGET_BIN: ryu-core
          FEATURES: ${{ env.CORE_FEATURES }}
        run: bash .github/scripts/assert-feature-set.sh

      - name: Stage binaries for the prebuilt image targets
        run: |
          mkdir -p .docker-prebuilt
          cp apps/core/target/release/ryu-core .docker-prebuilt/ryu-core
          cp apps/gateway/target/release/ryu-gateway .docker-prebuilt/ryu-gateway

      # Fast and readable: fails in a second, with the library and version named,
      # when a binary was bound to a newer glibc than the runtime image has.
      - name: Assert the binaries start on the runtime image's glibc
        run: node .github/scripts/assert-glibc-ceiling.mjs "$RUNTIME_GLIBC" .docker-prebuilt/ryu-core .docker-prebuilt/ryu-gateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build both images into the local Docker engine WITHOUT pushing, then start
      # every binary in them once. The push steps further down rebuild from this
      # builder's cache and the same staged binaries, so they publish the layers
      # that were started here.
      - name: Build ryu-core image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          load: true
          provenance: false
          tags: ryu-core:smoke
          cache-from: type=gha,scope=image-core

      - name: Build ryu-gateway image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          target: prebuilt
          load: true
          provenance: false
          tags: ryu-gateway:smoke
          cache-from: type=gha,scope=image-gateway

      # The Core image carries both binaries (Core spawns its own Gateway), so
      # both are started in it. See .github/scripts/smoke-start-image.sh for what
      # this does and does not prove.
      - name: Start every binary of both images once
        run: |
          bash .github/scripts/smoke-start-image.sh ryu-core:smoke ryu-core
          bash .github/scripts/smoke-start-image.sh ryu-core:smoke ryu-gateway --entrypoint ryu-gateway
          bash .github/scripts/smoke-start-image.sh ryu-gateway:smoke ryu-gateway

      - name: Dry run, nothing is pushed or redeployed
        if: github.ref != 'refs/heads/main'
        run: echo "::notice::Not on main ($GITHUB_REF), so the images were built and started but no tag is pushed and no deploy hook is called."

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ryu-core
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: prebuilt
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ryu-core:latest
            ghcr.io/${{ github.repository_owner }}/ryu-core:${{ github.sha }}
          cache-from: type=gha,scope=image-core
          cache-to: type=gha,mode=max,scope=image-core

      - name: Build and push ryu-gateway
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          target: prebuilt
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ryu-gateway:latest
            ghcr.io/${{ github.repository_owner }}/ryu-gateway:${{ github.sha }}
          cache-from: type=gha,scope=image-gateway
          cache-to: type=gha,mode=max,scope=image-gateway

      - name: Redeploy Core and Gateway
        if: github.ref == 'refs/heads/main'
        env:
          CORE_DEPLOY_HOOK_URL: ${{ secrets.CORE_DEPLOY_HOOK_URL }}
          GATEWAY_DEPLOY_HOOK_URL: ${{ secrets.GATEWAY_DEPLOY_HOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          deploy() {
            local name="$1" url="$2"
            if [ -z "$url" ]; then
              echo "::notice::$name: no deploy hook secret set; image pushed, nothing redeployed."
              return 0
            fi
            local headers=()
            if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
              headers+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            fi
            curl -sf -X POST "${headers[@]}" "$url" >/dev/null
            echo "$name: redeploy triggered."
          }
          deploy core "$CORE_DEPLOY_HOOK_URL"
          deploy gateway "$GATEWAY_DEPLOY_HOOK_URL"
