name: nightly

# Free nightly build of the open-core headless set (core / gateway / cli + the 11
# feature-app backend sidecars), published as a rolling `nightly` PRERELEASE on this
# public repo. GitHub Actions minutes are free for public repos, so this only ever runs
# here on amajorai/ryu — the workflow reaches this repo via the private monorepo's overlay
# (mirror/overlay/), never runs in ryu-closed.
#
# Why a prerelease is safe: Core's headless updater (apps/core/src/update/mod.rs) resolves
# `GET /repos/amajorai/ryu/releases/latest`, which GitHub defines to EXCLUDE prereleases and
# drafts. So even though the nightly assets reuse the real updater's names
# (ryu-core-<plat>, …), an installed Core node never auto-updates onto a nightly. Only the
# signed, tagged `v*` releases (release.yml) are ever "latest".
#
# Each nightly publishes under its OWN versioned tag (`v0.1.2-nightly.20260804.24`) and the
# channel keeps the last `RETAIN` builds — see the `prepare` job. Until 2026-08-04 this was a
# single rolling `nightly` tag that was deleted and recreated every run, so the channel held
# exactly one build and every earlier nightly was destroyed.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Skip the whole run when main has not moved since yesterday, so a quiet repo does not
  # republish identical binaries. Manual dispatch always builds. The 25h window is wider
  # than the 24h cron so a delayed scheduled run never drops a day of real commits.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='25 hours ago' --oneline)" ]; then
            echo "New commits on main — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 25h — skipping nightly."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Create TODAY's prerelease BEFORE the matrix uploads, so the parallel build jobs
  # upload into an existing release instead of racing to create it.
  #
  # HISTORY IS KEPT (changed 2026-08-04) — see the matching block in canary.yml for
  # the full rationale. In short: this used to `gh release delete nightly
  # --cleanup-tag` and recreate one rolling release, so only the newest nightly ever
  # existed and yesterday's was destroyed every day. Each nightly now gets its own
  # versioned tag (`v<version>`, e.g. `v0.1.2-nightly.20260804.24`), pruned to
  # `RETAIN`. Safe because Core resolves a channel by listing releases and taking the
  # semver maximum within it, never by tag name.
  prepare:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # next-version.mjs falls back to local tags when gh is unavailable
      # Compute the version ONCE here and hand it to every build job as an output.
      # It must not be recomputed per-job: `--build` is stable within a run, but
      # the UTC date stamp would roll over mid-run on a build that straddles
      # midnight, and two jobs would then stamp different versions into the same
      # release.
      - id: version
        name: Compute this nightly's version
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/release/next-version.mjs nightly)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $VERSION (tag v$VERSION)"
      - name: Create tonight's prerelease, then prune old ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          # Nightlies land once a day, so 14 is about two weeks of history.
          RETAIN: "14"
          # Optional. Unset = the changelog is the raw mirror-commit bullets,
          # which is already real content; set, they are merged into highlights.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        run: |
          set -e
          # Notes must be GENERATED before the release references them — the
          # rolling-build banner, no changelog (mirror history is just sync
          # commits, and no publish step follows to fill one in).
          # Banner + install block only; the changelog is appended below.
          node scripts/release-notes.mjs --channel nightly --repo "$GITHUB_REPOSITORY" --no-changelog > notes.md
          # A rolling build has NO follow-up step that can fill in notes later —
          # whatever is written here is what it ships with. The mirror commit
          # bodies in range carry real summaries, so read them.
          node scripts/rolling-notes.mjs --channel nightly --repo "$GITHUB_REPOSITORY" >> notes.md
          # The tag now CARRIES the version, so `release_version` reads it off the
          # tag and only falls back to the title. --prerelease is load-bearing:
          # `/releases/latest` excludes prereleases, which is what keeps a stable
          # node from auto-updating onto a nightly.
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION (${GITHUB_SHA:0:12})" \
            --notes-file notes.md

          # Prune to the newest $RETAIN. Matching on the tag shape
          # (`v<x.y.z>-nightly.*`) means this can never touch stable, beta or canary.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))]
                  | sort_by(.createdAt) | reverse | .['"$RETAIN"':][] | .tagName' \
            > stale.txt || true
          while read -r old; do
            [ -n "$old" ] || continue
            echo "pruning old nightly release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done < stale.txt

          # Retire the pre-2026-08-04 unversioned rolling `nightly` release once: it
          # can never win `pick_version_for_channel` against a versioned build, so
          # leaving it up would only pin a stale entry to the releases page.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  # Desktop installers. The source is source-available in this repo (see
  # LICENSE-COMMERCIAL.md), so it builds HERE on free public runners instead of
  # the private repo.
  #
  # Signing is OPTIONAL and secret-gated: with TAURI_SIGNING_PRIVATE_KEY set on
  # this repo the artifacts are signed and the updater accepts them; without it
  # the installers still build and are downloadable, they just carry no update
  # signature. That keeps the release working before any decision is made about
  # putting the signing key on a public repo.
  desktop:
    needs: [gate, prepare]
    name: desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            # NSIS only. The MSI target refuses a version whose pre-release
            # identifier is not numeric-only and <= 65535, and every rolling build
            # stamps one (`0.0.14-nightly.20260730.26`), so bundling MSI here has
            # never once succeeded. Stable releases stamp a bare `X.Y.Z` and keep
            # building both, so this narrowing is confined to the rolling channels.
            args: "--bundles nsis"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Stamp THIS build's version across the tree (Cargo.toml/lock, package.json,
      # tauri.conf.json, .env.production) BEFORE anything compiles. Without it the
      # binaries carry the in-tree version — the last stable release's number — so
      # no nightly is distinguishable from, or newer than, any other. Computed once
      # in `prepare` and reused here so every job stamps the same value.
      - name: Stamp the nightly version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # SECURITY (updater signing key scope): `bun install` is deliberately a
      # separate step with NO signing key in env, so a malicious dependency
      # postinstall script cannot read TAURI_SIGNING_PRIVATE_KEY. The key is
      # introduced only on the tauri-action step below. RESIDUAL RISK: tauri-action
      # runs the app's `beforeBuildCommand` (vite build), so build-time deps still
      # execute with the key in env; the action offers no hook to pre-run that in a
      # key-free step, so this residual cannot be closed at the workflow layer.
      - run: bun install
      # Stamp the release channel onto the bundle's OS-registered identity —
      # `productName` becomes "Ryu (Nightly)" / "(Canary)" / "(Beta)" /
      # "(Research Preview)", and the icon is re-tinted per channel. Derived from
      # the version already stamped above, so there is no second place to keep in
      # sync. Runs AFTER `bun install` because the icon expansion shells out to the
      # Tauri CLI from node_modules, and BEFORE tauri-action because bundle names
      # are read at bundle time. It never touches `version`, `mainBinaryName` or
      # `identifier` — see the script header for why each is off-limits.
      - name: Brand the bundle for its release channel
        shell: bash
        run: node scripts/release/channel-brand.mjs
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows needs the larger heap for the full desktop renderer bundle.
          NODE_OPTIONS: ${{ matrix.platform == 'windows-latest' && '--max-old-space-size=16384' || '--max-old-space-size=8192' }}
          # Vite INLINES these; apps/desktop/.env is gitignored, so without them a
          # released build bakes the localhost fallbacks and cannot sign in.
          VITE_APP_BACKEND_URL: ${{ vars.VITE_APP_BACKEND_URL || 'https://api.ryuhq.com' }}
          VITE_APP_FRONTEND_URL: ${{ vars.VITE_APP_FRONTEND_URL || 'https://ryuhq.com' }}
          VITE_APP_WEB_URL: ${{ vars.VITE_APP_WEB_URL || 'https://ryuhq.com' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        with:
          projectPath: apps/desktop
          # NO tagName/releaseName: those make tauri-action publish to the release
          # itself (an update-a-release PATCH), which the App token is refused
          # ("Resource not accessible by integration"). Build only; the installers
          # are collected and uploaded via the assets endpoint below.
          args: ${{ matrix.args }}
      - name: Collect desktop installers
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          mkdir -p dist-desktop
          find apps/desktop/src-tauri/target -type f \
            \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.msi" -o -name "*-setup.exe" -o -name "*.app.tar.gz" \
               -o -name "*.sig" \) \
            -not -path "*deps*" -exec cp {} dist-desktop/ \; || true
          # macOS names the updater bundle `<productName>.app.tar.gz` with NO arch
          # in it, so the aarch64 and x86_64 legs upload the SAME filename and
          # `--clobber` leaves only whichever finished last — one arch's updater
          # bundle is lost every run, and the channel feed cannot address both.
          # Stamp the arch in. (The .dmg/.exe/.AppImage names already carry arch
          # or are single-arch.)
          #
          # Glob the productName rather than hardcoding "Ryu": channel-brand.mjs
          # stamps the channel into productName before the bundle is built, so the
          # file is e.g. `Ryu Canary.app.tar.gz`. A literal `Ryu.app.tar.gz`
          # stopped matching the moment branding landed, silently reintroducing the
          # exact collision this block exists to prevent.
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$TAURI_ARGS" in
              *aarch64-apple-darwin*) arch=aarch64 ;;
              *) arch=x86_64 ;;
            esac
            shopt -s nullglob
            for f in dist-desktop/*.app.tar.gz dist-desktop/*.app.tar.gz.sig; do
              base="$(basename "$f")"
              # Already stamped (defensive: never double-stamp on a re-run).
              case "$base" in *-"$arch".app.tar.gz|*-"$arch".app.tar.gz.sig) continue ;; esac
              mv "$f" "dist-desktop/${base/.app.tar.gz/-$arch.app.tar.gz}"
            done
            shopt -u nullglob
          fi
          # Same rename the release workflow does — see its copy for why. Kept in
          # step across all three workflows so a channel build's artifacts are
          # named by the same rule as a stable one.
          node scripts/release/artifact-name.mjs --dir dist-desktop
          ls -la dist-desktop || true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-desktop/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no desktop installers on this platform — skipping" >&2; exit 0; fi
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber

  # Island companion (Electron). Same rationale as desktop: source-available here,
  # so it builds on free public runners.
  island:
    needs: [gate, prepare]
    name: island (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Same stamp as the desktop job — the Island's package.json version is what
      # electron-builder bakes into the installer filenames and its update feed.
      - name: Stamp the nightly version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # uiohook-napi compiles libuiohook from source on Linux and needs the X11
      # headers; without them node-gyp dies with "X11/keysym.h: No such file".
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxt-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxkbfile-dev libxrandr-dev libxi-dev libxcursor-dev libxss-dev
      - run: bun install
      # `build` only runs electron-vite; `dist` is the one that packages installers
      # via electron-builder. --publish never: the upload step below owns that, so
      # electron-builder never needs a token or races the release.
      - name: Package Island
        working-directory: apps/island
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The full renderer bundle peaks above Node's default heap on macOS.
          NODE_OPTIONS: --max-old-space-size=8192
          # node-gyp cannot locate Visual Studio on windows-latest without this.
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
        run: bun run dist -- --publish never
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-island
          # electron-builder's output layout varies per platform; take the
          # installers and skip the unpacked build trees.
          find apps/island -type f \
            \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" -o -name "*.zip" \) \
            -not -path "*/node_modules/*" -not -path "*unpacked*" \
            -exec cp {} dist-island/ \; || true
          ls -la dist-island || true
      # gh release upload (assets endpoint), NOT softprops: softprops PATCHes the
      # release (update-a-release), which the App token is refused. Rolling builds
      # stay lenient — a platform that produced no installer skips, not fails.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-island/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no island installers on this platform — skipping" >&2; exit 0; fi
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber

  build:
    needs: [gate, prepare]
    if: needs.gate.outputs.build == 'true'
    name: ${{ matrix.target.asset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # audiopus_sys (transitive: opus codec) vendors a CMakeLists that requires
    # cmake_minimum_required(<3.5); CMake >= 4.0 (current runner images) removed that
    # compatibility. CMake honours this env var to configure the legacy project anyway.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target:
          # core + gateway only. The TUI (shipped as ryu-cli) is Bun, not cargo;
          # app backends build in their own satellite repos.
          - { asset: ryu-core,       bin: ryu-core,       dir: apps/core,    features: "sandbox-wasmtime,voice-parakeet,voice-vad" }
          - { asset: ryu-gateway,    bin: ryu-gateway,    dir: apps/gateway }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This is the stamp that matters most for the update verdict: `ryu-core`'s
      # CARGO_PKG_VERSION is what `current_version()` reports and what every
      # surface's update check compares against.
      - name: Stamp the nightly version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libopus-dev

      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install dbus pkg-config opus

      - name: Install protoc (prost-build)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ matrix.target.dir }}

      # ── Core MUST carry its three shipped-but-not-default features ─────────────
      #    `sandbox-wasmtime`, `voice-parakeet` and `voice-vad` are off in
      #    `[features] default` so `cargo test`/`cargo check` stay lean (no
      #    wasmtime/cranelift, no ONNX Runtime). Off in `default` does NOT mean off
      #    in the product: this step used to run a bare `cargo build --release`, so
      #    every `ryu-core` this workflow ever published shipped with NO WASM sandbox
      #    (`detect_backend("wasmtime")` returns the compile-time feature, so it was
      #    false), NO parakeet STT inference (silently degrading to whisper) and NO
      #    Silero VAD. Core's updater has real channel support
      #    (`apps/core/src/update/mod.rs`), so a node on this channel installs what
      #    this job produces.
      #
      #    The flag lives on the matrix row because `ryu-gateway` declares none of
      #    these features and `--features` on it would be a hard error. Every build
      #    site that produces a ryu-core a human runs is enumerated in
      #    `apps/core/Cargo.toml` just above the `sandbox-wasmtime` declaration;
      #    adding a feature there means adding it to that list and to every site.
      - name: Build
        shell: bash
        run: |
          set -eu
          dir="${{ matrix.target.dir }}"
          features="${{ matrix.target.features }}"
          # Swatinem/rust-cache restores `target/`, so a fingerprint written by an
          # earlier (possibly featureless) run can survive into this one. Drop the
          # ryu-core bin fingerprint first: cargo re-links that single unit and
          # writes a fresh record, which is what the assert below grades. Without
          # this the assert could pass on a stale artifact — and an assertion that
          # might be reading last week's build is not an assertion.
          find "$dir/target/release/.fingerprint" -name bin-ryu-core.json -delete 2>/dev/null || true
          if [ -n "$features" ]; then
            cargo build --release --manifest-path "$dir/Cargo.toml" --features "$features"
          else
            cargo build --release --manifest-path "$dir/Cargo.toml"
          fi

      # ── Feature-set gate. Asserts what cargo actually BUILT (it records each
      #    unit's resolved feature set in the fingerprint JSON) rather than
      #    re-resolving with `cargo tree`, which would happily pass its own
      #    `--features` and go green over a featureless binary.
      #
      #    MATCH THE `features` KEY, NOT THE WHOLE FILE. The fingerprint holds two
      #    lists and only one says what was built:
      #      "features":"[\"default\", \"tool-exec-deno\"]"
      #      "declared_features":"[\"default\", \"sandbox-wasmtime\", …]"
      #    `declared_features` is present verbatim whether or not a feature was
      #    enabled, so grepping the file as a whole passes unconditionally. The
      #    leading `"` in the pattern is what keeps it out of `declared_features`
      #    (whose `features` is preceded by `_`).
      #
      #    The feature list is SPLIT OUT OF the matrix row rather than repeated, so
      #    the gate cannot drift from the flag it is guarding.
      - name: Assert the shipped feature set was actually built
        if: matrix.target.features != ''
        shell: bash
        run: |
          set -eu
          found=0
          missing=0
          for fingerprint in $(find "${{ matrix.target.dir }}/target/release/.fingerprint" -name "bin-${{ matrix.target.bin }}.json" 2>/dev/null); do
            found=$((found + 1))
            enabled=$(grep -ao '"features":"\[[^]]*\]"' "$fingerprint" | tr -d '\\' || true)
            if [ -z "$enabled" ]; then
              echo "::error::could not read the ENABLED feature list out of $fingerprint. Cargo's fingerprint format changed, so this assertion no longer guards the shipped feature set. Fix the check rather than deleting it — and do NOT fall back to grepping the whole file, which matches 'declared_features' and passes on any build."
              exit 1
            fi
            for feature in $(printf '%s' "${{ matrix.target.features }}" | tr ',' ' '); do
              if ! printf '%s' "$enabled" | grep -qF -- "\"$feature\""; then
                echo "::error::${{ matrix.target.bin }} was built WITHOUT '$feature' — enabled set per $fingerprint is $enabled. The published binary would ship without it and degrade silently."
                missing=1
              fi
            done
          done
          if [ "$found" = "0" ]; then
            echo "::error::no ${{ matrix.target.bin }} fingerprint under ${{ matrix.target.dir }}/target/release/.fingerprint — cargo's layout changed, so this assertion no longer guards the shipped feature set. Fix the check rather than deleting it."
            exit 1
          fi
          [ "$missing" = "0" ] || exit 1
          echo "${{ matrix.target.bin }} carries ${{ matrix.target.features }} ($found fingerprint(s) checked)"

      - name: Package
        shell: bash
        run: |
          set -e
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          # Same os-arch labels as release.yml so the asset names line up across trains;
          # macos-latest is Apple Silicon, so aarch64.
          case "${{ runner.os }}" in
            Linux)   plat="linux-x86_64" ;;
            macOS)   plat="macos-aarch64" ;;
            Windows) plat="windows-x86_64" ;;
          esac
          src="${{ matrix.target.dir }}/target/release/${{ matrix.target.bin }}${ext}"
          asset="${{ matrix.target.asset }}-${plat}${ext}"
          mkdir -p dist
          cp "$src" "dist/$asset"
          ( cd dist
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$asset" > "$asset.sha256"
            elif command -v shasum   >/dev/null 2>&1; then shasum -a 256 "$asset" > "$asset.sha256"
            else echo "! no sha256 tool — skipping checksum for $asset" >&2; fi )

      - name: Upload to the nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber

  # ── Per-channel updater feed ────────────────────────────────────────────────
  # Without this the desktop's `install_update_from_channel` finds no
  # `latest-nightly.json` on the rolling tag and falls back to the Stable feed, so a
  # user who opted into nightly is offered the *Stable* build. The rolling tag is
  # what makes a fixed feed URL possible at all: GitHub's `/releases/latest/`
  # excludes prereleases, and every rolling build is one.
  #
  # Runs after the desktop matrix so every platform's artifact + .sig is already
  # on the release. `if: always()` is deliberate: one platform leg failing should
  # still publish a feed for the platforms that DID build, rather than leaving the
  # channel on a stale feed. The script omits any platform whose .sig is missing.
  channel-feed:
    needs: [prepare, desktop]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble and publish latest-nightly.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 4th arg = the release to read assets from and publish the feed onto.
          # It used to default to the channel name, which only worked while the
          # channel WAS one rolling tag; builds now carry their own versioned tag.
          bash scripts/release/assemble-channel-feed.sh \
            nightly "${{ needs.prepare.outputs.version }}" "${{ github.repository }}" \
            "${{ needs.prepare.outputs.tag }}"
