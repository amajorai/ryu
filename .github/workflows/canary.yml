name: canary

# Bleeding-edge build of the open-core headless set (core / gateway / cli + the 11
# feature-app backend sidecars) on EVERY push to main that touches the built sources,
# published as a PRERELEASE on its own versioned tag (`v0.1.2-canary.20260804.36`). This is
# the fresh-on-merge companion to nightly.yml (the every-three-hours snapshot); use canary to test
# the very latest main. The channel keeps the last `RETAIN` builds (see `prepare`); before
# 2026-08-04 it was a single rolling `canary` tag, so only one build ever existed.
#
# Free-minutes note: like nightly.yml this reaches amajorai/ryu via the monorepo overlay
# (mirror/overlay/) and only ever runs on the public repo, never in ryu-closed.
#
# Prerelease safety (same as nightly): Core's updater resolves `releases/latest`, which
# GitHub excludes prereleases from, so installed nodes never auto-update onto a canary even
# though the assets reuse the real updater's names. Only signed `v*` releases are ever "latest".
#
# Concurrency: `cancel-in-progress: false` — a burst of merges QUEUES builds instead of killing
# an in-flight one. Cancelling mid-run would leave the `canary` release with a mix of new and
# --clobber'd old assets; queuing guarantees each run leaves a complete, consistent asset set.

on:
  push:
    branches: [main]
    paths:
      - "apps/core/**"
      - "apps/gateway/**"
      - "apps/cli/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  # Create THIS build's own prerelease before the matrix uploads, so parallel build
  # jobs upload into an existing release instead of racing to create it.
  #
  # HISTORY IS KEPT (changed 2026-08-04). This job used to `gh release delete canary
  # --cleanup-tag` and recreate a single rolling `canary` release, so the channel
  # only ever held ONE build and every previous canary was destroyed — you could not
  # look at yesterday's canary, bisect across two of them, or reference the build a
  # bug report named. Each build now gets its OWN versioned tag (`v<version>`, e.g.
  # `v0.1.2-canary.20260804.36`) and old ones are pruned to `RETAIN` below.
  #
  # This is safe for the updater because Core never resolves a rolling channel by
  # tag NAME: `select_release` lists the repo's releases, keeps the ones whose
  # version is on the channel, and takes the semver maximum (`pick_version_for_channel`
  # in apps/core/src/update/mod.rs). A versioned tag is in fact the STRONGER input —
  # `release_version` parses the tag first and only falls back to scanning the title,
  # so the build's identity no longer depends on the release title being well-formed.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Release notes diff against the previous tag — needs full history.
          fetch-depth: 0
      # Compute the version ONCE here and hand it to every build job as an output,
      # so a run that straddles midnight UTC cannot stamp two different date
      # components into the same release.
      - id: version
        name: Compute this canary's version
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/release/next-version.mjs canary)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Canary version: $VERSION (tag v$VERSION)"
      - name: Create this canary's prerelease, then prune old ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          # How many canary builds to keep. Old ones are deleted tag-and-all, so
          # this is the channel's entire retention. Keep it small enough that the
          # releases page stays readable and large enough to bisect across a few
          # days of merges.
          RETAIN: "10"
          # Optional. Unset = the changelog is the raw mirror-commit bullets,
          # which is already real content; set, they are merged into highlights.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        # Notes, create-or-reuse (a re-run keeps the run number and so the tag),
        # prune to RETAIN by tag shape, and retire the old unversioned `canary`
        # release. See .github/scripts/rolling-prerelease.sh.
        run: bash .github/scripts/rolling-prerelease.sh canary

  # Desktop installers, built on free public runners (source-available here).
  # Signing is OPTIONAL and secret-gated by TAURI_SIGNING_PRIVATE_KEY; see
  # .github/scripts/README.md ("Desktop signing is optional").
  desktop:
    needs: prepare
    name: desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            # NSIS only. The MSI target refuses a version whose pre-release
            # identifier is not numeric-only and <= 65535, and every rolling build
            # stamps one (`0.0.14-canary.20260730.26`), so bundling MSI here has
            # never once succeeded. Stable releases stamp a bare `X.Y.Z` and keep
            # building both, so this narrowing is confined to the rolling channels.
            args: "--bundles nsis"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Stamp THIS build's version across the tree (Cargo.toml/lock, package.json,
      # tauri.conf.json, .env.production) BEFORE anything compiles. Without it the
      # binaries carry the in-tree version — the last stable release's number — so
      # no canary is distinguishable from, or newer than, any other. Computed once
      # in `prepare` and reused here so every job stamps the same value.
      - name: Stamp the canary version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # SECURITY: `bun install` stays a separate step with NO signing key in env,
      # so a dependency postinstall cannot read TAURI_SIGNING_PRIVATE_KEY. Residual
      # risk in .github/scripts/README.md ("Signing-key scope during bun install").
      - run: bun install
      # Stamp the channel into productName and the icon. Must run AFTER `bun
      # install` and BEFORE tauri-action; see .github/scripts/README.md
      # ("Channel branding order").
      - name: Brand the bundle for its release channel
        shell: bash
        run: node scripts/release/channel-brand.mjs
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows needs the larger heap for the full desktop renderer bundle.
          NODE_OPTIONS: ${{ matrix.platform == 'windows-latest' && '--max-old-space-size=16384' || '--max-old-space-size=8192' }}
          # Vite INLINES these; apps/desktop/.env is gitignored, so without them a
          # released build bakes the localhost fallbacks and cannot sign in.
          VITE_APP_BACKEND_URL: ${{ vars.VITE_APP_BACKEND_URL || 'https://api.ryuhq.com' }}
          VITE_APP_FRONTEND_URL: ${{ vars.VITE_APP_FRONTEND_URL || 'https://ryuhq.com' }}
          VITE_APP_WEB_URL: ${{ vars.VITE_APP_WEB_URL || 'https://ryuhq.com' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        with:
          projectPath: apps/desktop
          # NO tagName/releaseName: those make tauri-action publish to the release
          # itself (an update-a-release PATCH), which the App token is refused
          # ("Resource not accessible by integration"). Build only; the installers
          # are collected and uploaded via the assets endpoint below.
          args: ${{ matrix.args }}
      # Copy the bundles out, stamp the arch into the macOS updater bundle, and
      # rename by the same artifact-name rule as a stable release. Shared with
      # release.yml; see .github/scripts/collect-desktop-installers.sh.
      - name: Collect desktop installers
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.args }}
        run: bash .github/scripts/collect-desktop-installers.sh
      # gh release upload (assets endpoint), NOT softprops. Rolling builds stay
      # lenient: a platform that produced no installer skips, not fails. See
      # .github/scripts/upload-release-assets.sh.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist-desktop skip "no desktop installers on this platform — skipping"

  # Island companion (Electron). Same rationale as desktop: source-available here,
  # so it builds on free public runners.
  island:
    needs: prepare
    name: island (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Same stamp as the desktop job — the Island's package.json version is what
      # electron-builder bakes into the installer filenames and its update feed.
      - name: Stamp the canary version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # uiohook-napi compiles libuiohook from source on Linux and needs the X11
      # headers; how the set was derived is in .github/scripts/README.md.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxt-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxkbfile-dev libxrandr-dev libxi-dev libxcursor-dev libxss-dev
      - run: bun install
      # `build` only runs electron-vite; `dist` is the one that packages installers
      # via electron-builder. --publish never: the upload step below owns that, so
      # electron-builder never needs a token or races the release.
      - name: Package Island
        working-directory: apps/island
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The full renderer bundle peaks above Node's default heap on macOS.
          NODE_OPTIONS: --max-old-space-size=8192
          # node-gyp cannot locate Visual Studio on windows-latest without this.
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
        run: bun run dist -- --publish never
      - name: Collect installers
        shell: bash
        run: bash .github/scripts/collect-island-installers.sh
      # gh release upload (assets endpoint), NOT softprops. Rolling builds stay
      # lenient: a platform that produced no installer skips, not fails.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: bash .github/scripts/upload-release-assets.sh "$TAG" dist-island skip "no island installers on this platform — skipping"

  build:
    needs: prepare
    name: ${{ matrix.target.asset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Guard for vendored CMake builds, as in .cargo/config.toml: CMake >= 4.0
    # (current runner images) refuses a project whose cmake_minimum_required is
    # below 3.5 unless this is set. Opus no longer needs it: opus 0.4 builds its
    # bundled libopus through opusic-sys, whose CMakeLists requires CMake >= 3.16.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target:
          # core + gateway only. The TUI (shipped as ryu-cli) is Bun, not cargo;
          # app backends build in their own satellite repos.
          - { asset: ryu-core,       bin: ryu-core,       dir: apps/core,    features: "sandbox-wasmtime,voice-parakeet,voice-vad" }
          - { asset: ryu-gateway,    bin: ryu-gateway,    dir: apps/gateway }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This is the stamp that matters most for the update verdict: `ryu-core`'s
      # CARGO_PKG_VERSION is what `current_version()` reports and what every
      # surface's update check compares against.
      - name: Stamp the canary version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/release/bump-version.sh "$VERSION"

      # pkg-config + libssl-dev for openssl-sys, libdbus-1-dev / dbus for
      # libdbus-sys. No system libopus: opus 0.4 (opusic-sys, default `bundled`)
      # compiles libopus from source with CMake and links it statically, so
      # ryu-core needs no libopus to build or to run.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install dbus pkg-config

      - name: Install protoc (prost-build)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ matrix.target.dir }}

      # Core MUST carry its shipped-but-not-default features (`sandbox-wasmtime`,
      # `voice-parakeet`, `voice-vad`); the flag lives on the matrix row because
      # `ryu-gateway` declares none of them. Rationale, and where every ryu-core
      # build site is listed, in .github/scripts/build-cargo-target.sh.
      - name: Build
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          FEATURES: ${{ matrix.target.features }}
        run: bash .github/scripts/build-cargo-target.sh

      # Feature-set gate: asserts what cargo actually BUILT, read from the
      # fingerprint's `features` key (never `declared_features`, which passes on
      # any build). See .github/scripts/assert-feature-set.sh.
      - name: Assert the shipped feature set was actually built
        if: matrix.target.features != ''
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          TARGET_BIN: ${{ matrix.target.bin }}
          FEATURES: ${{ matrix.target.features }}
        run: bash .github/scripts/assert-feature-set.sh

      # Same os-arch labels as release.yml so asset names line up across trains;
      # macos-latest is Apple Silicon, so MACOS_PLAT pins aarch64.
      - name: Package
        shell: bash
        env:
          TARGET_DIR: ${{ matrix.target.dir }}
          TARGET_BIN: ${{ matrix.target.bin }}
          TARGET_ASSET: ${{ matrix.target.asset }}
          MACOS_PLAT: macos-aarch64
        run: bash .github/scripts/package-binary.sh

      - name: Upload to the canary prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber

  # ── Per-channel updater feed ────────────────────────────────────────────────
  # Without this the desktop's `install_update_from_channel` finds no
  # `latest-canary.json` on the rolling tag and falls back to the Stable feed, so a
  # user who opted into canary is offered the *Stable* build. The rolling tag is
  # what makes a fixed feed URL possible at all: GitHub's `/releases/latest/`
  # excludes prereleases, and every rolling build is one.
  #
  # Runs after the desktop matrix so every platform's artifact + .sig is already
  # on the release. `if: always()` is deliberate: one platform leg failing should
  # still publish a feed for the platforms that DID build, rather than leaving the
  # channel on a stale feed. The script omits any platform whose .sig is missing.
  channel-feed:
    needs: [prepare, desktop]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assemble and publish latest-canary.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 4th arg = the release to read assets from and publish the feed onto.
          # It used to default to the channel name, which worked only while the
          # channel WAS a single rolling tag. Builds now carry their own versioned
          # tag, so the feed has to be told which one this run produced.
          bash scripts/release/assemble-channel-feed.sh \
            canary "${{ needs.prepare.outputs.version }}" "${{ github.repository }}" \
            "${{ needs.prepare.outputs.tag }}"
