# gitleaks config for the Ryu open-core repo.
[extend]
useDefault = true

[allowlist]
description = "Known-safe test fixtures (no real secrets)"
# Dummy API key used in the gateway audit unit tests to verify redaction.
regexes = [
  '''sk-secret-1234567890''',
  # Historical mesh-auth unit-test fixture. It is assembled at runtime now;
  # this exact value remains only in older public mirror commits.
  '''ryu_secret_0123456789abcdef0123456789''',
  # Documentation-only placeholder retained in older public mirror commits.
  '''ryu-sk-your-secret-key''',
  # Non-secret JWT-shaped adapter sentinel retained in older public mirror commits.
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJodHRwczovL2FwaS5vcGVuYWkuY29tL2F1dGgiOnsiY2hhdGdwdF9hY2NvdW50X2lkIjoicnl1LWxvY2FsIn19\.''',
]
paths = [
  # Vendored single-file plugin-UI fixtures: minified/bundled third-party web apps
  # (e.g. the Excalidraw-style whiteboard) shipped verbatim as Core manifest fixtures.
  # They embed public client identifiers (a Firebase web apiKey — a project id, not a
  # credential) and trip generic-api-key on minified JS tokens. No real Ryu secret lives
  # here; scanning a vendored bundle is out of scope for this repo's secret hygiene.
  '''apps/core/src/plugin_manifest/fixtures/.*\.ui\.html''',
  # The same kind of single-file companion bundle when Core embeds it straight from
  # an app's committed sidecar build (tools/mirror-public/includes.mjs vendors it).
  '''generated/ryu-runtime/apps-store/[^/]+/sidecar/bundle/.*\.html''',
  # Older public mirror commits carried this generated visual-proof bundle. It
  # is now pruned from the public tree, but the allowlist keeps history scans
  # honest about its bundled third-party credential-like strings.
  '''apps/desktop/e2e/harness/dist-private-team-visibility-proof/.*''',
  # The generated goal-completion proof was present in an earlier public mirror
  # commit. Its browser clear-key UUID fixtures and shortcut text are test data,
  # not credentials; the current overlay prunes the bundle, and this history
  # allowlist keeps the full-history CI scan honest.
  '''apps/desktop/e2e/harness/dist-goal-completion-proof/.*''',
  # Desktop build-time env. Every value here is `VITE_`-prefixed, which means Vite
  # INLINES it into the shipped bundle — the PostHog project key and Sentry DSN are
  # public client identifiers present in every released binary, by design. Publishing
  # this file changes nothing about their exposure. A real secret must never be added
  # here: if it needs to stay secret, it cannot be a VITE_ var.
  '''apps/desktop/\.env\.production''',
  # Editor keymap: `keys: "mod+shift+enter"` is a keyboard shortcut that happens to
  # match generic-api-key's key/value heuristic.
  '''packages/ui/src/components/editor/plugins/.*-kit\.tsx''',
  # App scaffold README: `dev-token` in a curl example is a placeholder, not a secret.
  '''packages/create-ryu-app/template/app/README\.md''',
  # Quest keys are stable identifiers, not credentials. The generic-api-key rule
  # treats the `refer-3-monthly` / `refer-5-monthly` names as secrets.
  '''packages/auth/src/lib/quests\.ts''',
]
