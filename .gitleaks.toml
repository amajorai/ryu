# gitleaks config for the Ryu open-core repo.
#
# CI scans the FULL public history, so path and value allowlists (not inline
# `gitleaks:allow` comments) are what keep values in older mirror commits quiet.
# Uses `[[allowlists]]` (gitleaks >= 8.25): the legacy single `[allowlist]` table
# cannot be combined with it. Blocks with `targetRules` only silence the listed
# default rules, so provider-specific rules (github-pat, openai, aws, stripe,
# private-key, ...) still fire on a real credential pasted into a test file.
[extend]
useDefault = true

[[allowlists]]
description = "Known-safe test fixtures (no real secrets)"
# Dummy API key used in the gateway audit unit tests to verify redaction.
regexes = [
  '''sk-secret-1234567890''',
  # Historical mesh-auth unit-test fixture. It is assembled at runtime now;
  # this exact value remains only in older public mirror commits.
  '''ryu_secret_0123456789abcdef0123456789''',
  # Documentation-only placeholder retained in older public mirror commits.
  '''ryu-sk-your-secret-key''',
  # Non-secret JWT-shaped adapter sentinel retained in older public mirror commits.
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJodHRwczovL2FwaS5vcGVuYWkuY29tL2F1dGgiOnsiY2hhdGdwdF9hY2NvdW50X2lkIjoicnl1LWxvY2FsIn19\.''',
]
paths = [
  # Vendored single-file plugin-UI fixtures: minified/bundled third-party web apps
  # (e.g. the Excalidraw-style whiteboard) shipped verbatim as Core manifest fixtures.
  # They embed public client identifiers (a Firebase web apiKey — a project id, not a
  # credential) and trip generic-api-key on minified JS tokens. No real Ryu secret lives
  # here; scanning a vendored bundle is out of scope for this repo's secret hygiene.
  '''apps/core/src/plugin_manifest/fixtures/.*\.ui\.html''',
  # The same kind of single-file companion bundle when Core embeds it straight from
  # an app's committed sidecar build (tools/mirror-public/includes.mjs vendors it).
  '''generated/ryu-runtime/apps-store/[^/]+/sidecar/bundle/.*\.html''',
  # Older public mirror commits carried this generated visual-proof bundle. It
  # is now pruned from the public tree, but the allowlist keeps history scans
  # honest about its bundled third-party credential-like strings.
  '''apps/desktop/e2e/harness/dist-private-team-visibility-proof/.*''',
  # The generated goal-completion proof was present in an earlier public mirror
  # commit. Its browser clear-key UUID fixtures and shortcut text are test data,
  # not credentials; the current overlay prunes the bundle, and this history
  # allowlist keeps the full-history CI scan honest.
  '''apps/desktop/e2e/harness/dist-goal-completion-proof/.*''',
  # Desktop build-time env. Every value here is `VITE_`-prefixed, which means Vite
  # INLINES it into the shipped bundle — the PostHog project key and Sentry DSN are
  # public client identifiers present in every released binary, by design. Publishing
  # this file changes nothing about their exposure. A real secret must never be added
  # here: if it needs to stay secret, it cannot be a VITE_ var.
  '''apps/desktop/\.env\.production''',
  # Editor keymap: `keys: "mod+shift+enter"` is a keyboard shortcut that happens to
  # match generic-api-key's key/value heuristic.
  '''packages/ui/src/components/editor/plugins/.*-kit\.tsx''',
  # App scaffold README: `dev-token` in a curl example is a placeholder, not a secret.
  '''packages/create-ryu-app/template/app/README\.md''',
  # Quest keys are stable identifiers, not credentials. The generic-api-key rule
  # treats the `refer-3-monthly` / `refer-5-monthly` names as secrets.
  '''packages/auth/src/lib/quests\.ts''',
]

[[allowlists]]
description = "Test-only files: dummy passwords, tokens, JWTs and key vectors"
# Only the two heuristic rules. A real provider key or PEM private key in one of
# these files is still reported by its specific rule.
targetRules = ["generic-api-key", "jwt"]
paths = [
  # TypeScript unit/coverage tests and Playwright e2e specs (`*.test.ts(x)`,
  # `*.spec.ts(x)`, including `__tests__/`): sample passwords, bearer tokens,
  # idempotency UUIDs and JWT-shaped strings exercising redaction/sealing.
  '''\.(test|spec)\.tsx?$''',
  # Rust test-only modules split out of their parent (`tests.rs`, `*_test.rs`,
  # `*_tests.rs`).
  '''(^|/)tests\.rs$''',
  '''_tests?\.rs$''',
  # Deterministic crypto/protocol test vectors (fixed-seed keys, nonces, sealed
  # blobs) consumed only by the crates' vector tests.
  '''(^|/)crates/core/(crypto|hardware)/tests/vectors/[^/]+\.json$''',
  # Vendored upstream rust-genai recorded HTTP responses (yakbak). The flagged
  # `prompt_cache_key` values are request UUIDs, not credentials.
  '''(^|/)vendor/genai/tests/data/yakbak/''',
]

[[allowlists]]
description = "Throwaway private keys generated for unit tests"
targetRules = ["private-key"]
# RSA signing key for the ChatGPT Plan identity tests; only included from the
# `#[cfg(test)] mod tests` in apps/core/src/pi_config/chatgpt_plan.rs, and its
# JWKS twin is likewise only trusted by those tests.
paths = ['''(^|/)apps/core/src/pi_config/fixtures/chatgpt-plan-test-private\.pem$''']
# Legacy P-256 / P-384 PKCS#8 keys in the `#[cfg(test)]` module of
# apps/core/src/vault/transit.rs that pin elliptic-curve migration compatibility.
# Matched by a key-specific fragment of each body, not the shared PKCS#8 header.
regexes = [
  '''Jclc3u5TK30CSE8SNyo0nx03''',
  '''daUBCcGk5CSNVUIqQBQR6vfC''',
]

[[allowlists]]
description = "Dummy values inside #[cfg(test)] modules of production sources, and i18n text"
targetRules = ["generic-api-key"]
# Exact placeholder values; production files are not path-allowlisted.
regexes = [
  # apps/core/src/composio_host.rs (connect_suggestion_tests)
  '''^ghp_0123456789abcdefghijkl$''',
  # apps/core/src/hardware/node_key.rs (base64 of a literal label)
  '''^c2VjcmV0LW5vZGUta2V5$''',
  # apps/core/src/log_rotation.rs
  '''^ryu_0123456789abcdef0123456789abcdef$''',
  # apps/core/src/pi_config/secret_env.rs (env var name, hex of a provider id)
  '''^RYU_PI_KEY_616E7468726F706963$''',
  # apps/core/src/server/app_webhooks.rs
  '''^replacement-secret-0123456789$''',
  # apps/core/src/server/conversations.rs (a conversation id, not a key)
  '''^conversation-1$''',
  # apps/core/src/server/preferences.rs
  '''^prm-legacy-bearer-3f9a1c$''',
  # apps/core/src/sidecar/mcp/mod.rs
  '''^ghp-legacy-2b8e$''',
  # apps/core/src/vault/totp/mod.rs (base32 of "1234567890", RFC 6238 style)
  '''^GEZDGNBVGY3TQOJQ$''',
  # apps/gateway/src/api/mod.rs (route_tests)
  '''^gwrelay_conventions_0123456789abcdef$''',
  # crates/core/crypto/src/sealed.rs
  '''^sk-live-abc123$''',
  # crates/core/sidecar-runtime/src/peer_proof.rs (malformed-proof case)
  '''^0123456789abcdef0123456789abcde/?$''',
  # crates/core/webhook-ingress/src/ryu_relay.rs
  '''^tok-legacy-9c2e$''',
  # packages/i18n/locales/de.json: German UI text after "...arrow keys to rotate."
  '''^Ryu-3D-Geist\.?$''',
]
