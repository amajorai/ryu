# Self-host the Ryu open-core stack with Docker Compose.
#
#   docker compose up --build
#
# This runs Core and Gateway as two separate services (the production shape),
# using the one image built from ./Dockerfile. Core decides *what runs*; the
# Gateway governs *what is allowed* on every model call. Core reaches the
# Gateway over the compose network rather than spawning it in-process
# (RYU_GATEWAY_MANAGED=0 + RYU_GATEWAY_URL), so each can be scaled and inspected
# on its own.
#
# Point any OpenAI-compatible client at Core on http://localhost:7980. On first
# boot Core downloads a fully-local model stack (llama.cpp + Gemma 4, nomic
# embeddings, whisper) into the /data volume, so it works with no API key. To
# skip that download on a small host, set a provider key (e.g. OPENAI_API_KEY)
# in the environment and Core routes there instead.
#
# The compose stack requires GATEWAY_MASTER_KEY. It is used only as the local
# service-to-service bearer here; the gateway is never published to the host,
# runs rootless, drops all Linux capabilities, and has a read-only root FS.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryu:local
    # Override the entrypoint: this service IS the gateway, bound to all
    # interfaces inside the compose network. `--bind=` (with the equals sign)
    # is how ryu-gateway takes its listen address.
    entrypoint: ["ryu-gateway", "--bind=0.0.0.0:7981"]
    environment:
      # Provider credentials live on the Gateway. Uncomment and supply your own,
      # or leave unset to use Core's first-run local model stack.
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      GATEWAY_ADMIN_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      RYU_GATEWAY_FLEET: "1"
      RYU_GATEWAY_PORT: "7981"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    volumes:
      - ryu-gateway-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7981/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryu:local
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RYU_GATEWAY_TOKEN: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      GATEWAY_ADMIN_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      RYU_BIND: "0.0.0.0:7980"
      RYU_DIR: "/data"
      # Core reads /data/.config/ryu/node-config.json. The example is mounted
      # for the local stack so this path is exercised end to end; replace the
      # source with a private copy when customizing local behavior.
      XDG_CONFIG_HOME: "/data/.config"
      # Use the gateway service instead of spawning a local one.
      RYU_GATEWAY_MANAGED: "0"
      RYU_GATEWAY_URL: "http://gateway:7981"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ports:
      - "7980:7980"
    volumes:
      - ryu-data:/data
      - ./config/node-config.example.json:/data/.config/ryu/node-config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7980/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

volumes:
  ryu-data:
  ryu-gateway-data:
