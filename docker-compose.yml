# Self-host the Ryu open-core stack with Docker Compose.
#
#   docker compose up --build
#
# This runs Core and Gateway as two separate services (the production shape),
# using the one image built from ./Dockerfile. Core decides *what runs*; the
# Gateway governs *what is allowed* on every model call. Core reaches the
# Gateway over the compose network rather than spawning it in-process
# (RYU_GATEWAY_MANAGED=0 + RYU_GATEWAY_URL), so each can be scaled and inspected
# on its own.
#
# Point any OpenAI-compatible client at Core on http://localhost:7980. On first
# boot Core downloads a fully-local model stack (llama.cpp + Gemma 4, nomic
# embeddings, whisper) into the /data volume, so it works with no API key. To
# skip that download on a small host, set a provider key (e.g. OPENAI_API_KEY)
# in the environment and Core routes there instead.
#
# The compose stack requires four distinct Gateway credentials: an admin key
# for Core's administrative client, an inference relay for agent requests, a
# trusted Core relay, and a proof-only signer. ACP children receive none of the
# Core/admin secrets. The gateway is never published to the host,
# runs rootless, drops all Linux capabilities, and has a read-only root FS.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryu:local
    # Override the entrypoint: this service IS the gateway, bound to all
    # interfaces inside the compose network. `--bind=` (with the equals sign)
    # is how ryu-gateway takes its listen address.
    entrypoint: ["ryu-gateway", "--bind=0.0.0.0:7981"]
    environment:
      # Provider credentials live on the Gateway. Uncomment and supply your own,
      # or leave unset to use Core's first-run local model stack.
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      GATEWAY_RELAY_KEY: ${GATEWAY_RELAY_KEY:?set GATEWAY_RELAY_KEY before starting the stack}
      GATEWAY_CORE_RELAY_KEY: ${GATEWAY_CORE_RELAY_KEY:?set GATEWAY_CORE_RELAY_KEY before starting the stack}
      GATEWAY_CORE_PROOF_KEY: ${GATEWAY_CORE_PROOF_KEY:?set GATEWAY_CORE_PROOF_KEY before starting the stack}
      # Optional identity secrets (base64 of 32+ random bytes each, e.g.
      # `openssl rand -base64 32`). Set RYU_IDENTITY_ROOT to keep end-user
      # hashes stable across restarts. A self-hosted gateway never sends a
      # Ryu-derived identity to your providers, with or without them.
      RYU_IDENTITY_ROOT: ${RYU_IDENTITY_ROOT:-}
      RYU_IDENTITY_PEPPER: ${RYU_IDENTITY_PEPPER:-}
      # Exposure hardening for a gateway reached through another container:
      # auth can never be switched off and a 127.0.0.1 peer is never trusted as
      # the local operator. It does not make this a hosted Ryu gateway, so none
      # of Ryu's hosted-fleet rules apply to this stack.
      RYU_GATEWAY_FLEET: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    volumes:
      - ryu-gateway-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7981/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ryu:local
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RYU_GATEWAY_TOKEN: ${GATEWAY_RELAY_KEY:?set GATEWAY_RELAY_KEY before starting the stack}
      RYU_GATEWAY_CORE_TOKEN: ${GATEWAY_CORE_RELAY_KEY:?set GATEWAY_CORE_RELAY_KEY before starting the stack}
      RYU_GATEWAY_CORE_PROOF_KEY: ${GATEWAY_CORE_PROOF_KEY:?set GATEWAY_CORE_PROOF_KEY before starting the stack}
      GATEWAY_ADMIN_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY before starting the stack}
      RYU_BIND: "0.0.0.0:7980"
      RYU_DIR: "/data"
      # Core reads /data/.config/ryu/node-config.json. The example is mounted
      # for the local stack so this path is exercised end to end; replace the
      # source with a private copy when customizing local behavior.
      XDG_CONFIG_HOME: "/data/.config"
      # Use the gateway service instead of spawning a local one.
      RYU_GATEWAY_MANAGED: "0"
      RYU_GATEWAY_URL: "http://gateway:7981"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ports:
      - "7980:7980"
    volumes:
      - ryu-data:/data
      - ./config/node-config.example.json:/data/.config/ryu/node-config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7980/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5

volumes:
  ryu-data:
  ryu-gateway-data:
