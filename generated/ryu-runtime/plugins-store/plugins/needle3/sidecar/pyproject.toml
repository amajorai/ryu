[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ryu-needle3-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
server = ["fastapi==0.115.12", "uvicorn==0.34.0", "cactus-needle==3.0.1"]

[project.scripts]
ryu-needle3 = "ryu_needle3.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ryu_needle3*"]
