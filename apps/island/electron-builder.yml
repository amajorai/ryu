appId: ai.amajor.ryu.island
productName: Ryu Island
# electron-builder's default `@electron/rebuild` step needs a `node-abi` entry for
# the pinned Electron train. When a security bump lands before node-abi is updated,
# skip rebuild: Island native deps (uiohook-napi, koffi, …) ship N-API/generic
# prebuilds and are unpacked from asar anyway (see `asarUnpack` below).
npmRebuild: false
# NSIS toolset for the Windows `nsis` and `portable` targets. The default ("0.0.0")
# is the legacy NSIS 3.0.4.1, whose `Contrib/Language files/Hindi.nsh` leaves the
# MULTIUSER_INNERTEXT_INSTALLMODE_CURRENTUSER string unterminated (line 128). Our
# assisted installer (`oneClick: false`) defines MULTIUSER_INSTALLMODEPAGE, so
# with `hi_IN` in `nsis.installerLanguages` makensis stopped with "unterminated
# string parsing line". "1.2.1" is electron-builder's unified NSIS 3.12 bundle,
# whose Hindi file parses. electron-builder-languages.test.ts pins this pairing.
toolsets:
  nsis: "1.2.1"
# Stable, predictable artifact names so a downloader (e.g. the desktop's
# `~/.ryu/bin`-style managed-companion install, mirroring ryu-core's
# `install.rs`) can hardcode a `releases/latest/download/<name>` URL. Without a
# pinned name electron-builder emits version-stamped, space-containing defaults
# ("Ryu Island Setup 0.0.1.exe") that no fixed URL can resolve. The two Windows
# `.exe` producers (nsis, portable) get distinct `-setup`/`-portable` overrides
# below to avoid a same-name collision; every other target differs by extension.
artifactName: ryu-island-${os}-${arch}.${ext}
directories:
  output: artifacts
  # `resources/` (not the conventional `build/`, which the root .gitignore excludes)
  # so the tracked `resources/icon.png` reaches CI. electron-builder auto-discovers
  # `icon.png` here and derives the per-target icons (.ico / .icns / linux png set).
  buildResources: resources
# electron-vite emits main/preload/renderer bundles into out/; package those plus
# the manifest. `resources/**` carries `?asset` files (e.g. the tray icon, which
# the main bundle references as `__dirname/../../resources/...`). Everything else
# (src, node_modules dev deps) is excluded.
files:
  - out/**
  - resources/**
  - package.json
# `uiohook-napi` is a native module (its prebuilt `.node` powers hold-to-talk key
# release + Tab agent-cycling in the island). Native binaries cannot be `require`d
# from inside the asar, so unpack them onto the real filesystem. electron-builder's
# smartUnpack normally detects this, but pin it explicitly since the feature breaks
# silently (voice input still works via the global shortcut) if the binary is missing.
# `koffi` carries the AppKit mask bridge (and Windows fullscreen signal).
# Liquid Glass and Mica also ship native binaries; all must load outside asar.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/koffi/**"
  - "**/node_modules/electron-liquid-glass/**"
  - "**/node_modules/mica-electron/**"
# Icons for every target are derived by electron-builder from `resources/icon.png`
# (512×512, the buildResources dir above): it emits the .ico (Windows), .icns
# (macOS), and the Linux png set.
# `mica-electron` is a Windows-only optionalDependency loaded lazily + win32-guarded
# (see main/window.ts), so it never breaks the macOS/Linux package. Code signing /
# notarization is still out of scope — unsigned builds run with a Gatekeeper warning
# (macOS) and need the AppImage chmod'd (Linux); CI signing is a follow-on.
win:
  target:
    - nsis
    - portable
# `portable` is the spawnable single-exe target (no install step): it self-extracts
# to a temp dir on launch, so a desktop-managed companion install can download this
# one file and spawn it directly, exactly like the self-contained `ryu-core` binary.
# Stable name (no version) so `releases/latest/download/ryu-island-windows-<arch>-portable.exe`
# always resolves.
portable:
  artifactName: ryu-island-${os}-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Ryu Island
  # Distinct from the portable exe (both are `.exe`) so they never collide in the
  # release. This is the interactive installer for users who install island standalone.
  artifactName: ryu-island-${os}-${arch}-setup.${ext}
  # The wizard and uninstaller follow the Windows display language. Without this
  # list electron-builder uses its bundled set, which has no Hindi, so a Hindi
  # user got English while the desktop installer was in Hindi. This is that set
  # plus hi_IN (stock NSIS ships the Hindi MUI file). Entries need the
  # language_REGION form: a bare `hi` resolves to `hi_HI`, which has no LCID.
  # electron-builder's own 26 messages (messages.yml, assistedMessages.yml)
  # fall back to English where upstream has no translation (all assisted-page
  # strings for ar and hi_IN; upstream keys its one Hindi string as `hi`, which
  # resolves to hi_HI). `include` replaces those with catalog translations: it is
  # generated by scripts/sync-island-nsis-languages.mjs (do not edit it).
  # electron-builder-languages.test.ts pins every official locale.
  include: resources/installer-languages.nsh
  installerLanguages:
    - en_US
    - ar_SA
    - de_DE
    - es_ES
    - fr_FR
    - hi_IN
    - it_IT
    - ja_JP
    - ko_KR
    - pt_BR
    - ru_RU
    - zh_CN
    - zh_TW
    - nl_NL
    - da_DK
    - sv_SE
    - nb_NO
    - fi_FI
    - pt_PT
    - pl_PL
    - uk_UA
    - cs_CZ
    - sk_SK
    - hu_HU
    - tr_TR
    - th_TH
    - vi_VN
# macOS: the island is a menu-bar companion, so `LSUIElement: true` makes it an
# accessory app (menu-bar tray + global hotkey, no Dock icon, no app menu).
# NSMicrophoneUsageDescription is required for the renderer's getUserMedia voice
# input; its translations ship as `<lproj>.lproj/InfoPlist.strings` through the
# generated extraResources block (scripts/sync-island-infoplist-strings.mjs owns
# it and the English text's source). Ship both `dmg` (download) and `zip` (electron-updater reads the zip +
# latest-mac.yml — a .dmg alone cannot auto-update).
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Ryu Island uses the microphone for voice input.
  # BEGIN generated by scripts/sync-island-infoplist-strings.mjs; do not edit.
  extraResources:
    - from: resources/locales/en.lproj/InfoPlist.strings
      to: en.lproj/InfoPlist.strings
    - from: resources/locales/ar.lproj/InfoPlist.strings
      to: ar.lproj/InfoPlist.strings
    - from: resources/locales/de.lproj/InfoPlist.strings
      to: de.lproj/InfoPlist.strings
    - from: resources/locales/es.lproj/InfoPlist.strings
      to: es.lproj/InfoPlist.strings
    - from: resources/locales/fr.lproj/InfoPlist.strings
      to: fr.lproj/InfoPlist.strings
    - from: resources/locales/hi.lproj/InfoPlist.strings
      to: hi.lproj/InfoPlist.strings
    - from: resources/locales/it.lproj/InfoPlist.strings
      to: it.lproj/InfoPlist.strings
    - from: resources/locales/ja.lproj/InfoPlist.strings
      to: ja.lproj/InfoPlist.strings
    - from: resources/locales/ko.lproj/InfoPlist.strings
      to: ko.lproj/InfoPlist.strings
    - from: resources/locales/pt_BR.lproj/InfoPlist.strings
      to: pt_BR.lproj/InfoPlist.strings
    - from: resources/locales/ru.lproj/InfoPlist.strings
      to: ru.lproj/InfoPlist.strings
    - from: resources/locales/zh_CN.lproj/InfoPlist.strings
      to: zh_CN.lproj/InfoPlist.strings
  # END generated by scripts/sync-island-infoplist-strings.mjs.
# Linux: AppImage (portable, supports electron-updater) + deb. The tray needs an
# AppIndicator host (KDE/Unity have it natively; GNOME needs the AppIndicator
# extension) — the global hotkey is the fallback control surface where it is absent.
linux:
  category: Utility
  target:
    - AppImage
    - deb
# Auto-update feed: GitHub releases on the canonical Ryu repo, matching Core's
# `RYU_REPO` ("amajorai/ryu"). electron-updater reads this feed via the
# `app-update.yml` electron-builder emits into the packaged resources.
publish:
  provider: github
  owner: amajorai
  repo: ryu
  # The island installers land in amajorai/ryu's matching v{version} release — the
  # same one the desktop + binaries are mirrored into, so a single release holds
  # every bundle for the version. That release MUST already exist (mirrored by the
  # train): release-island.yml's `preflight` job refuses to run otherwise, because
  # with no release this setting would create a full, non-prerelease v{version}
  # holding only Island and GitHub would make it `releases/latest`. Against an
  # existing published release it has no effect.
  releaseType: release
