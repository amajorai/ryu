[package]
name = "desktop"
version = "0.5.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.5.6", features = [] }

[features]
# Builds the "Ryu Dev" variant: `profile::name()` reports "dev" even when
# RYU_PROFILE is unset, so a packaged dev build talks to the dev Core (:8980) and
# uses ~/.ryu-dev. Pair with `--config src-tauri/tauri.dev.conf.json` (distinct
# bundle id + product name). OFF by default → release builds are byte-identical.
dev-variant = []

[dependencies]
fs4 = "0.8.4"
ryu-runtime-install = { path = "../../../crates/core/runtime-install" }
# The data-dir layout (`layout::state_path`, `layout::secret_path`, …) shared with
# Core, so Desktop reads and writes the same files Core does.
ryu-sidecar-runtime = { path = "../../../crates/core/sidecar-runtime", features = ["peer-probe"] }
# Seals the desktop's own stores (auth vault, license key, CLI-setup snapshots)
# with a key held in the OS keychain (`desktop_seal.rs`). Default features keep
# the keychain backend, the same `keyring` 3 the BYOK vault already links.
ryu-crypto = { path = "../../../crates/core/crypto" }
# `devtools` keeps Toggle DevTools / Inspect available when Developer Mode is
# on in packaged builds (debug builds already enable the inspector).
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api", "image-png", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-decorum = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Deep linking: register the `ryu://` scheme so links from a browser open the
# app (cold start) or focus the running one (warm start). On Windows/Linux the
# OS spawns a fresh process with the URL as argv; single-instance (with the
# `deep-link` feature) forwards it to the live instance and fires `onOpenUrl`.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Shared single-source-of-truth for the automation permission gates (Accessibility
# + Screen Recording). The same crate backs the ghost CLI, Core, and the sidecar.
ghost-permissions = { path = "../../../crates/ghost/permissions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
ryu-gw-credentials = { path = "../../../crates/gateway/credentials" }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
tempfile = "3"
getrandom = "0.3"
tokio = { version = "1", features = ["full"] }
dirs = "5"
which = "7"
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
tracing = "0.1"
sysinfo = { version = "0.33", features = ["system"] }
tauri-plugin-autostart = "2.5.1"
jsonc-parser = { version = "0.27.0", features = ["cst", "serde"] }
json5 = "0.4"
serde_yaml = "0.9"
chrono = "0.4"
# OS notifications with the sender's avatar image (see `os_notifications.rs`);
# the same backend tauri-plugin-notification uses, without dropping the image.
notify-rust = "4.18"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.59", features = [
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: re-add the native titled style mask so the traffic-light buttons exist
# in the transparent shell (see `apply_macos_titlebar_mask` in lib.rs).
# Pinned to 0.25 to share the same build decorum already links.
[target.'cfg(target_os = "macos")'.dependencies]
# AppKit's semantic NSVisualEffectView gives transparent Desktop surfaces a
# native backdrop; the React layer decides which surfaces reveal it.
window-vibrancy = "0.6"
cocoa = "0.25"
keyring = { version = "3", features = ["apple-native"] }
# Quick Capture's double-Shift event tap + the AX/pasteboard readers. Pinned to
# the versions `cocoa 0.25` already links: two copies of the same framework types
# in one binary produce mismatch errors that read like a bug in our own code.
core-graphics = "0.23"
core-foundation = "0.9"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
