<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<title>Tab views proof</title>
	</head>
	<body>
		<div id="root"></div>
		<script>
			// Keep this layout proof in the shared OS shell so the route registry is
			// exercised; the Bot product intentionally hides non-chat routes.
			localStorage.setItem("ryu:product-mode", "os");
			window.process = {
				cwd: () => "/",
				env: {},
				nextTick: (callback) => queueMicrotask(callback),
			};
		</script>
		<script src="./tab-views-proof.tsx" type="module"></script>
	</body>
</html>
