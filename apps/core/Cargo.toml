# OpenTelemetry seam (#539, P1): the vendor-neutral instrumentation export path.
# `tracing-opentelemetry` 0.33 bridges the existing `tracing` spans into OTel; it
# pins `opentelemetry` ^0.32, so the whole family is pinned to 0.32 to keep ONE
# `opentelemetry` in the tree (a version skew pulls two and breaks the layer's
# trait bounds). OTLP/HTTP-protobuf only (`http-proto` + `reqwest-client`) so we
# avoid tonic/grpc — Axiom and most collectors speak OTLP/HTTP. The exporter is
# installed ONLY on consent (see main.rs); with the pref off nothing egresses and
# the local `trace.rs` SQLite sink is untouched. The backend is a swappable config
# value (`diagnostics-otlp-endpoint` / `OTEL_EXPORTER_OTLP_ENDPOINT`), never a lock.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.33"

# Crash reporting tier (#544, P3) — Sentry for Rust PANICS ONLY, gated on the
# `crash-reports-enabled` pref (separate consent from product analytics) + a DSN
# env (`SENTRY_DSN`/`RYU_SENTRY_DSN`); absent DSN => disabled, never crashes boot.
# Deliberately NO `sentry-tracing`/`sentry-log` feature: those sweep `tracing`/log
# events (which can hold prompt/agent content + `~/.ryu` paths) into Sentry. We
# take only the `panic` integration + `backtrace`/`contexts`, and a `before_send`
# scrubs home-dir paths from the panic message + frames. `reqwest`+`native-tls`
# transport matches the tree's existing reqwest (no second TLS stack pulled).
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }

# transcribe-rs (the ONNX Runtime dep) is no longer a direct Core dep: the parakeet
# STT engine moved to `ryu-stt` and the Silero VAD engine moved to `ryu-vad`, each
# carrying its own copy at the same version behind its own feature.
# Core reaches both only through those crates' forwarded features (`voice-parakeet`
# / `voice-vad`), so nothing in `apps/core/src` uses `transcribe_rs` directly.

# The sidecar sandbox execution primitive, extracted into `ryu-sandbox`
# (in-process default). Non-optional: Core's sidecar/session/eval-code data paths
# reach it unconditionally. Its wasmtime backend moved into the crate; Core's own
# `sandbox-wasmtime` feature forwards to `ryu-sandbox/sandbox-wasmtime`.
ryu-sandbox = { path = "../../crates/core/sandbox" }

# Optional: wasmtime sandbox backend (feature sandbox-wasmtime). Cross-platform
# (macOS/Windows/Linux), so it MUST live in the main [dependencies] table — not
# under a per-OS [target...] block, or `dep:wasmtime` resolves to nothing off
# that OS and the feature fails to compile there. Still needed here by the
# pre-existing #188 M6 spike (`src/sandbox/mod.rs::wasmtime_backend`), which is a
# separate module from the extracted `sidecar/sandbox` and uses wasmtime directly;
# Cargo dedupes the shared build with `ryu-sandbox`'s copy. Binary-size delta
# (release): measured in docs/spikes/0188-wasmtime-wasi-ceiling.md
wasmtime = { version = "45", optional = true }
wasmtime-wasi = { version = "45", features = ["p1", "p2"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# The at-rest master-key OS keychain deps moved to `crates/ryu-crypto` with the
# crypto primitive. `winreg`/`winapi` stay here — they are used by
# `sidecar/path_manager.rs` (Windows PATH management), not crypto.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser"] }

# (Parakeet v3 STT optional deps — transcribe-rs + once_cell — live in the main
# [dependencies] table above, NOT here: they are cross-platform and must not be
# gated to this linux-only target block. See the comment beside them.)

[features]
# Programmatic tool calling (PTC, #476). TWO backends exist, not four:
# `tool-exec-deno` (the default) — a Deno subprocess (no crate dep — Deno is on
# PATH), deny-by-default permissions, real process isolation; and
# `tool-exec-securexec` (rivet secure-exec, V8 isolate) — off by default,
# forwarding to `ryu-tool-exec/tool-exec-securexec`, which really does gate code
# (`securexec_backend.rs`, behind a `securexec_available()` probe).
#
# There were two more here, `tool-exec-quickjs = []` (in-process rquickjs) and
# `tool-exec-justbash = []` (just-bash in-memory shell), documented as
# "registered/selectable but gated as stubs". They were neither: grepping
# `quickjs`/`justbash` across `apps/core/src` and `crates/` matched nothing but
# this comment, so both features gated ZERO code — `--features tool-exec-quickjs`
# produced a binary byte-identical to the default while implying a sandbox
# choice, and the empty declarations were the only thing making the PTC seam look
# four-wide. Deleted. Re-add one only in the same change as the code it gates.
# (`apps/fumadocs/content/docs/core/{sandbox,programmatic-tool-calling}.mdx` used to
# describe rquickjs as an available flag; both were corrected in the same wave, so the
# published docs now name `tool-exec-securexec` as the one alternative backend.)
default = ["tool-exec-deno"]
tool-exec-deno = ["ryu-tool-exec/tool-exec-deno", "ryu-eval-code/tool-exec-deno"]
# Deep-research is now FULLY OUT-OF-PROCESS: the `ryu-research` sidecar serves
# `/api/research/*` via the manifest `public_mount` (generic ext-proxy loader) and the
# `research.*` MCP tools via `ryu-research mcp` (manifest `mcp_servers`), so Core
# neither merges `research_routes` nor links the crate — there is no `research` cargo
# feature and no `ryu-research` dependency. The Python engine lifecycle
# (`ResearchManager` + `sidecar::tools::research`) stays Core-side; the Rust sidecar's
# `ResearchHost::start_sidecar` is a deliberate no-op.
# (The former in-process `clips` feature was retired in the CoreDecouple wave: clips
# is now the out-of-process `@ryu/clips` app — `apps-store/clips/backend` spawned
# by the generic sidecar loader, `/api/clips/*` served via `public_mount`. The two
# `ClipsHost` kernel couplings degrade cleanly in the standalone sidecar.)
# Recipes is FULLY OUT-OF-PROCESS: the `ryu-recipes` sidecar owns the `/api/recipes/*`
# surface (over Ghost's shared `~/.ghost/recipes/` RecipeStore) and serves it via the
# manifest `public_mount` (generic ext-proxy loader), so there is no in-process
# `recipes_routes` merge, no `recipes` cargo feature, and NO `ryu-recipes` dependency.
# The workflow executor's `Recipe`/`GhostAction` nodes drive Core's OWN built-in ghost
# MCP tool (`sidecar::mcp::GHOST_RUN_TOOL` + `client::extract_mcp_json`) through the
# shared registry, and the recorder subprocess stays Core-side in `recipes_host.rs`,
# reached by the sidecar via `/api/host/capability/ghost.*` (`recipes_client`) — a
# JSON boundary, no shared Rust types.
# Teams is now OUT-OF-PROCESS: the `ryu-teams` sidecar owns `teams.db` and serves
# `/api/teams/*` via the manifest `public_mount` (generic ext-proxy loader), so there is
# no in-process `teams_routes` merge and no `teams` cargo feature. Nor is there a
# `ryu-teams` dependency any more: the `@team` chat orchestration +
# `agent_builder__create_agent_team` reach the store over loopback HTTP
# (`crate::teams_client::TeamsClient`), and the only Rust they share with the app is the
# `TeamRecord`/`Coordination`/`CreateTeam` wire contract, factored out into
# `crates/core/teams-contracts` and linked by both sides.
# (The former in-process `healing` feature was retired in the CoreDecouple wave, and
# the `ryu-healing` lib dep that outlived it is gone too: self-healing is the
# out-of-process `@ryu/healing` app — `apps-store/healing/backend`'s `[[bin]]` spawned
# by the generic sidecar loader, `/api/healing/*` served via `public_mount`. Core keeps
# only the welded action side via `healing_client`, over the shared
# `crates/core/healing-contracts` verdict; the run-status bus loop stays kernel and
# posts to the sidecar.)
# (The former in-process `mail` feature was retired in Track C: mail is now the
# out-of-process `@ryu/mail` app — `crates/ryu-mail` spawned by the generic
# sidecar loader, `/api/mail/*` served via `public_mount`. `mail-parser` moved
# to that crate.)
tool-exec-securexec = ["ryu-tool-exec/tool-exec-securexec"]

# ── The three "off in default, ON in every shipped binary" features ───────────
# `sandbox-wasmtime` + `voice-parakeet` + `voice-vad` are off in `default` on
# purpose (spike 0188): a `cargo test`/`cargo check` run then pulls neither
# wasmtime/cranelift nor ONNX Runtime, which is minutes of CI time per job.
#
# Off in `default` does NOT mean off in the product. Every binary a human runs
# must carry all three, and SEVEN build sites are responsible for passing
# `--features sandbox-wasmtime,voice-parakeet,voice-vad`. In THIS repo:
#   1. apps/core/package.json     — `dev`, `dev:watch`, `build`
#   2. .github/workflows/release.yml — the `binaries` job (published assets: what
#      the desktop's `core/install.rs` downloads AND the one-liner installer)
#   3. scripts/release/release-local.sh — `build_binaries`
#   4. Dockerfile                 — the builder stage (every deploy button)
# And in `mirror/overlay/.github/workflows/`, which is published INTO the public
# `amajorai/ryu` repo and therefore builds Core with the public tree's own copies
# of `crates/core/{sandbox,stt,vad}` (all three are mirrored wholesale, so the
# features resolve there):
#   5. release.yml — the `build` job; fires on a `v*` tag pushed directly to the
#      public repo. Rare, but it uploads with `--clobber`, so it can OVERWRITE a
#      correctly-featured asset that `mirror-releases.yml` copied under that tag.
#   6. nightly.yml — the `build` job. Runs DAILY on the public repo.
#   7. canary.yml  — the `build` job. Runs on EVERY push to public main.
# (6) and (7) are not hypothetical: `apps/core/src/update/mod.rs` has first-class
# channel support, so a node on the nightly or canary channel installs exactly
# what those two jobs produce.
# Adding a feature to this list means adding it to all seven. The list was
# verified EXHAUSTIVE by a tree-wide grep for `cargo build` across
# `.github/ mirror/ scripts/ tools/ Dockerfile* apps/core/{package.json,scripts}`;
# the other hits build something else (the SDK cdylib, satellite app backends, the
# gateway image) or build Core in DEBUG for checks-only jobs that publish nothing
# — `mirror/overlay/.github/workflows/ci.yml` and `scripts/integration-tests.sh`.
# That second pair is a knowingly-lean Core: the headless integration suite
# therefore exercises a binary with no WASM sandbox. Deliberate (it keeps the
# suite fast, same rationale as `default`), and stated here so nobody reads suite
# coverage as coverage of the shipped configuration.
#
# This comment used to say only (1) mattered — "the dev and release binaries the
# user actually runs DO enable it — see the dev/dev:watch/build scripts in
# apps/core/package.json". Half true, and the false half was the shipping half:
# (2)…(7) each ran a bare `cargo build --release`, so every Core a user
# ever downloaded had NO WASM sandbox (`detect_backend("wasmtime")` false), NO
# parakeet inference (STT silently fell back to whisper) and NO Silero VAD, while
# every developer had all three and could not reproduce any of it. It was then
# corrected to "FOUR build sites", which was the same defect one layer down: (5),
# (6) and (7) were still bare, so the enumeration a reader would trust to be
# exhaustive silently excluded the two channels that publish most often.
#
# (2), (5), (6) and (7) now assert the resolved feature graph after the build —
# they read cargo's own `bin-ryu-core.json` fingerprint — so a dropped flag fails
# the release instead of shipping a lean binary that lies about its capabilities.
# The fingerprint PATH differs between the two repos and the assertions differ
# with it: here the build is a workspace member, so it is
# `target/release/.fingerprint/*/bin-ryu-core.json`; the public mirror ships NO
# root Cargo.toml (every manifest is its own workspace), so there it is
# `apps/core/target/release/.fingerprint/*/bin-ryu-core.json`. (5)–(7) also drop
# any restored fingerprint before building, because those jobs use
# Swatinem/rust-cache and an assertion that might be grading last week's artifact
# is not an assertion. If you touch that assertion, note that it must match the
# fingerprint's `features` key SPECIFICALLY: the same file also carries
# `declared_features`, which lists all three names on a completely featureless
# build. The first version of the check grepped the whole file and was therefore
# vacuous. Each site's step comment carries the full argument.
sandbox-wasmtime = ["dep:wasmtime", "dep:wasmtime-wasi", "ryu-sandbox/sandbox-wasmtime"]
# Parakeet STT inference (the default STT engine). The in-process ONNX engine now
# lives in the extracted `ryu-stt` crate; this feature forwards to the crate's own
# `voice-parakeet` (which pulls transcribe-rs/once_cell there). Without it the
# parakeet sidecar refuses to start and reports `Unhealthy` naming this feature
# (it used to report "Running" and 500 every transcription), and
# `default_stt_engine()` resolves to whisper.
voice-parakeet = ["ryu-stt/voice-parakeet"]
# Neural VAD for voice mode (the default). The endpointing/barge-in state machine
# + an energy-based probability backend are always compiled (voice mode works
# without this); enabling `voice-vad` swaps in the noise-robust Silero VAD ONNX
# model via transcribe-rs's tested `SileroVad` (we already depend on transcribe-rs
# for parakeet). NOTE: the original plan was TEN VAD, but its ONNX model is not
# usable standalone — its feature extraction lives in a closed precompiled native
# lib — so Silero (fully open) is used instead. Off in Cargo `default` on purpose
# (see the shipped-feature-set block above — all SEVEN build sites enable it; do
# not restate the count here without re-reading that block, this line said "four"
# for one round after the block itself was corrected to seven, which is the same
# stale-enumeration defect the block above narrates). Any inference error falls
# back per-hop to the always-compiled energy VAD, so this is the one of the three
# whose absence degrades quietly *by design*.
voice-vad = ["ryu-vad/voice-vad"]

[dev-dependencies]
tempfile = "3"
# The identity-governance tests (`src/identity/{consult,elicitation,governed}.rs`)
# drive the extracted vault's `IdentityStore::open_in_memory()` + cipher seeding,
# which are gated behind ryu-vault's `test-support` feature. Cargo unifies this
# with the regular `ryu-vault` dep, so the feature is on only for test builds.
ryu-vault = { path = "../../crates/core/vault", features = ["test-support"] }
# `tower::ServiceExt::oneshot`, to drive a Router in-process from a test (the App
# route-gate tests in `server/mod.rs`). Test-only on purpose: the production build
# uses tower for layers and does not need the `util` feature, so this stays a
# dev-dependency rather than widening the shipped feature set.
tower = { version = "0.4", features = ["util"] }
