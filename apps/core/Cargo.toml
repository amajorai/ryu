[package]
name = "ryu-core"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

# Why each dependency and feature exists: see DEPENDENCIES.md (and docs/dependencies-*.md).
# Keep rationale there; leave only short load-bearing notes (pins, advisories, caveats) here.

# Declares the opt-in voice features so their dormant gated code passes unexpected_cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("voice-parakeet", "voice-vad"))'] }

[dependencies]
ryu-runtime-install = { path = "../../crates/core/runtime-install", features = ["tokio-process"] }
ryu-gw-credentials = { path = "../../crates/gateway/credentials" }
ryu-gw-providers = { path = "../../crates/gateway/providers" }
ryu-gw-router = { path = "../../crates/gateway/router" }
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
ryu-email-send = { path = "../../crates/core/email-send" }
ryu-a2a = { path = "../../crates/core/a2a" }
ryu-acp-server = { path = "../../crates/core/acp-server" }
ryu-app-events = { path = "../../crates/core/app-events" }
ryu-backup = { path = "../../crates/core/backup" }
ryu-egress = { path = "../../crates/core/egress" }
ryu-deletion-guard = { path = "../../crates/core/deletion-guard" }
ryu-safe-actions = { path = "../../crates/core/safe-actions" }
ryu-agent-contracts = { path = "../../crates/core/agent-contracts" }
dirs = "5"
anyhow = "1"
libc = "0.2"
libloading = "0.8"
notify = "6"
url = "2"
futures-util = "0.3"
async-stream = "0.3"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# Commands are exec'd argv-style, never through `sh -c`; do not swap for a shell.
shell-words = "1"
regex = "1"
tempfile = "3"
cap-std = "=3.4.6"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["io"] }
flate2 = "1"
bzip2 = "0.5"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
sqlite-vec = "=0.1.6"
humantime = "2"
zstd = "0.13"
urlencoding = "2"
unicode-normalization = "0.1"
base64 = { version = "0.22", features = ["alloc"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# `ring` is selected explicitly: both rustls crypto providers are compiled into the workspace.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
chacha20poly1305 = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
hkdf = "0.12"
aes = "0.8"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-parser = { version = "0.18", features = ["verify"] }
yrs = "0.27"
# RUSTSEC-2026-0150 (audiopus_sys) is ignored in deny.toml; see docs/dependencies-third-party.md#opus.
opus = "0.3"
hound = "3"
# Depend on resvg alone (it re-exports usvg/tiny-skia) to keep one version of each.
resvg = "0.44"
png = "0.17"
# Exact pin. `unstable_mcp_over_acp` stays OFF on purpose; see docs/dependencies-third-party.md.
agent-client-protocol = { version = "=3.5.0", features = [
    "process",
    # `PromptResponse.usage` per-turn token totals (the `data-acp-usage` stats frame).
    "unstable_end_turn_token_usage",
] }
rmcp = { version = "2", features = ["server", "transport-io"] }
schemars = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
petgraph = "0.8"
noyalib = { version = "0.0.58", default-features = false, features = ["std", "compat-serde-yaml"] }
ghost-core = { path = "../../crates/ghost/core" }
ghost-permissions = { path = "../../crates/ghost/permissions" }
ryu-kernel-contracts = { path = "../../crates/core/kernel-contracts" }
ryu-channel-contracts = { package = "ryu-gw-contracts", path = "../../crates/gateway/contracts" }
ryu-skills = { path = "../../crates/core/skills" }
ryu-output-styles = { path = "../../crates/core/output-styles" }
# Out-of-process apps (dashboards, quests, clips, recipes, teams, research, healing,
# meetings, finetune, monitors) are NOT dependencies; see docs/dependencies-out-of-process-apps.md.
ryu-teams-contracts = { path = "../../crates/core/teams-contracts" }
ryu-healing-contracts = { path = "../../crates/core/healing-contracts" }
ryu-notify = { path = "../../crates/core/notify" }
ryu-learning = { path = "../../crates/core/learning" }
ryu-predict = { path = "../../crates/core/predict" }
ryu-hardware = { path = "../../crates/core/hardware" }
ryu-webhook-ingress = { path = "../../crates/core/webhook-ingress" }
ryu-composio = { path = "../../crates/core/composio" }
ryu-search = { path = "../../crates/core/search" }
ryu-stt = { path = "../../crates/core/stt" }
ryu-image = { path = "../../crates/core/image" }
ryu-improvement = { path = "../../crates/core/improvement" }
ryu-improvement-contracts = { path = "../../crates/core/improvement-contracts" }
ryu-optimizer = { path = "../../crates/core/optimizer" }
ryu-vad = { path = "../../crates/core/vad" }
# `peer-probe` - the loopback peer proof Core runs before it sends Shadow its bearer.
ryu-sidecar-runtime = { path = "../../crates/core/sidecar-runtime", version = "0.5.0", features = ["peer-probe"] }
ryu-engines = { path = "../../crates/core/engines" }
ryu-rag = { path = "../../crates/core/rag" }
ryu-vector-stores = { path = "../../crates/core/vector-stores" }
ryu-durable = { path = "../../crates/core/durable" }
ryu-workspace = { path = "../../crates/core/workspace" }
ryu-knowledge = { path = "../../crates/core/knowledge" }
ryu-spaces = { path = "../../crates/core/spaces" }
ryu-mesh = { path = "../../crates/core/mesh" }
# `sqlite` - the phase-2 content_sqlite migration helper the Core stores use.
ryu-crypto = { path = "../../crates/core/crypto", features = ["sqlite"] }
ryu-memory = { path = "../../crates/core/memory" }
ryu-realtime = { path = "../../crates/core/realtime" }
ryu-collab = { path = "../../crates/core/collab" }
ryu-usage = { path = "../../crates/core/usage" }
ryu-tracing = { path = "../../crates/core/tracing" }
ryu-vault = { path = "../../crates/core/vault" }
ryu-downloads = { path = "../../crates/core/downloads" }
ryu-model-format = { path = "../../crates/core/model-format" }
ryu-model-catalog = { path = "../../crates/core/model-catalog" }
ryu-mcp-catalog = { path = "../../crates/core/mcp-catalog" }
ryu-openapi-import = { path = "../../crates/core/openapi-import" }
ryu-tool-registry = { path = "../../crates/core/tool-registry" }
# Sandbox backend features forward to these crates; see docs/dependencies-core-crates.md.
ryu-tool-exec = { path = "../../crates/core/tool-exec", default-features = false }
ryu-eval-code = { path = "../../crates/core/eval-code", default-features = false }
ryu-code-runner = { path = "../../crates/core/code-runner" }
ryu-storage = { path = "../../crates/core/storage" }
ryu-activity = { path = "../../crates/core/activity" }
async-trait = { version = "0.1" }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
# Keep the whole OpenTelemetry family on 0.32 (tracing-opentelemetry 0.33 pins it); a
# skew pulls two copies. The blocking reqwest client is required by the batch exporter.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.33"

# Panics only. Do NOT add `sentry-tracing`/`sentry-log`, which would ship prompt content.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }

ryu-sandbox = { path = "../../crates/core/sandbox" }


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Used by `sidecar/path_manager.rs` (Windows PATH management), not crypto.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser"] }

[features]
# `js-sandbox` (QuickJS on Wasmtime, in-process) backs PTC, plugin JS and JS evaluators.
default = ["js-sandbox"]
js-sandbox = ["ryu-tool-exec/js-sandbox", "ryu-eval-code/js-sandbox"]

# Off in `default`, ON in every shipped binary: all SEVEN build sites listed in
# DEPENDENCIES.md must pass `--features sandbox-wasmtime,voice-parakeet,voice-vad`.
sandbox-wasmtime = ["ryu-sandbox/sandbox-wasmtime"]
# Without it the parakeet sidecar reports `Unhealthy` and STT resolves to whisper.
voice-parakeet = ["ryu-stt/voice-parakeet"]
# Silero VAD; without it voice mode falls back to the always-compiled energy VAD.
voice-vad = ["ryu-vad/voice-vad"]

[dev-dependencies]
tempfile = "3"
# `crypto_host::install_for_tests` installs CoreCryptoHost once for the test binary.
ctor = "0.2"
# `test-support` (in-memory IdentityStore) unifies with the regular dep in test builds only.
ryu-vault = { path = "../../crates/core/vault", features = ["test-support"] }
# Test-only `util` (`ServiceExt::oneshot`) for in-process Router tests.
tower = { version = "0.4", features = ["util"] }
