[package]
name = "ryu-gw-screening"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/amajorai/ryu"
description = "Ryu Gateway hazard screener backends: the ScreenerBackend trait and verdict types, the role chain (concurrent local backends, fallback-only remote processors, per-code max, deadlines, qualification), the isolated SafetyClient, the keyed segment cache, and the guard model (Llama Guard, Qwen3Guard), systemone decision model (local and remote), inspector and test adapters. Pure HTTP clients and parsers with no gateway types; the admission glue stays in apps/gateway."

[features]
# Deterministic sentinel backend and mock guard / systemone engines for tests.
# Enabled only from dev-dependencies, so release builds carry no RYU_TEST string.
test-backends = ["dep:axum"]

[dependencies]
ryu-gw-firewall = { path = "../firewall" }
async-trait = "0.1"
axum = { version = "0.7", optional = true }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
lru = "0.18"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
