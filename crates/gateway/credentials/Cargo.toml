[package]
name = "ryu-gw-credentials"
version = "0.1.0"
edition = "2021"
# Apache-2.0, unlike the rest of crates/gateway: Core (Apache-2.0) links this
# crate, so a copyleft license here would bind Core. See docs/open-core.md.
license = "Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
# `gateway.toml` secret sealing (`sealed_config`). No OS keychain here: Core
# turns it on for its own build, and a standalone Gateway resolves its key from
# Core's delivery or `RYU_MASTER_KEY` (see docs/encryption-at-rest.md).
ryu-crypto = { path = "../../core/crypto", version = "0.5.0", default-features = false }
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
