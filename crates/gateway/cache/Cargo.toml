[package]
name = "ryu-gw-cache"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/amajorai/ryu"
description = "Ryu Gateway response-cache stage: the exact-match TTL cache (CacheBackend) and the embedding-similarity semantic cache (SemanticCacheBackend), each a swappable trait + id-keyed registry with an in-memory built-in and a Redis/Valkey backend (semantic search by brute force or RediSearch KNN), plus the /v1/embeddings cache (memory LRU or Redis). A self-contained extracted gateway stage crate."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"
# `rt-multi-thread` for `block_in_place`, which lets the legacy sync cache verbs
# reach Redis on the Gateway's multi-thread runtime.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
ryu-redis-wire = { path = "../../core/redis-wire", version = "0.5.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ryu-redis-wire = { path = "../../core/redis-wire", version = "0.5.0", features = ["testing"] }
