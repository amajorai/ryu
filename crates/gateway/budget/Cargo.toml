[package]
name = "ryu-gw-budget"
version = "0.2.3"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/amajorai/ryu"
description = "Ryu Gateway charged-spend stage: per-user / per-agent / per-session USD caps plus the per-window exec budget, as a swappable BudgetBackend trait + registry with an in-memory built-in."

[dependencies]
serde = { version = "1", features = ["derive"] }
dashmap = "6"
ryu-gw-contracts = { path = "../contracts", version = "0.2.3" }

[dev-dependencies]
serde_json = "1"
