[package]
name = "ryu-tracing"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Per-run observability trace primitive for Ryu: the hierarchical span store (trace_id/span_id/parent_span_id, agent_run/workflow_run/workflow_step/model_call/tool_call/retrieval/memory/guardrail kinds, status, attributes, consent-gated inputs/outputs) backed by SQLite, the run trace tree and trace search reads behind the desktop trace viewer, and the OTLP exporter presets (Langfuse, LangSmith, Braintrust, Arize Phoenix, Helicone, Datadog). Token counts and cost stay Gateway-side; this store holds NO token or cost fields. ZERO dependency on apps/core: `TraceStore::open` takes an explicit db path."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so there is no version skew when
# Core links this crate in-process. This crate has ZERO dependency on apps/core.
[dependencies]
anyhow = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tracing = "0.1"
# sync: `Mutex` guards the SQLite connection.
tokio = { version = "1", features = ["sync", "rt"] }
# Langfuse Basic auth in the OTLP exporter presets.
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
