[package]
name = "ryu-storage"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Plugin-owned key/value storage primitive for Ryu: an isolated, `(plugin_id, namespace, key)`-namespaced SQLite KV store (the plugin-host `storage:kv` capability's backing state). An extracted Core capability crate; in-process by default and consumed as a NON-optional path dependency (the plugin turn-hook runtime reaches it unconditionally). `PluginStorage::open` takes an explicit db path, so the crate has ZERO dependency on apps/core — the default-path choice and the process-global handle stay Core-side as wiring."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so there is no version skew when
# Core links this crate in-process. This crate has ZERO dependency on apps/core.
[dependencies]
anyhow = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
# Phase-2 content sealing (encb:v1 / RYU-CB01 / blind indexes). No OS keychain
# backend from this crate: Core links it through its own dependency.
ryu-crypto = { path = "../crypto", version = "0.5.0", default-features = false, features = ["sqlite"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# Test builds only: lets unit tests construct sealing stores without a host.
ryu-crypto = { path = "../crypto", version = "0.5.0", default-features = false, features = ["test-ephemeral-host"] }
