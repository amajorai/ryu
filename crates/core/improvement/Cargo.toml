[package]
name = "ryu-improvement"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Core-owned durable SQLite store for Ryu recursive-improvement runs."
repository = "https://github.com/amajorai/ryu"

[dependencies]
ryu-improvement-contracts = { path = "../improvement-contracts", version = "0.5.0" }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
