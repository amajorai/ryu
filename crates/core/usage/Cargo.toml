[package]
name = "ryu-usage"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"
description = "Per-agent subscription usage-metering primitive for Ryu: reads the credential a subscription CLI (Claude Code, Codex, Copilot, Grok, Z.ai GLM) already stored on this machine and calls the vendor's own usage endpoint to return normalized rolling rate-limit windows (5h session, weekly, per-model) plus the non-percent figures - credit balances, Codex's banked rate-limit resets with a per-credit expiry date, extra-usage spend. NEVER refreshes the token (single-use refresh tokens rotate; refreshing would log the real CLI out) and never spends a banked reset (irreversible). crates.io caps `description` at 1000 chars, so keep this under that limit."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so there is no version skew when
# Core links this crate in-process. This crate has ZERO dependency on apps/core.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep reqwest's default features (rustls/native TLS) — the usage calls are HTTPS
# to api.anthropic.com / chatgpt.com; dropping defaults would break the TLS backend.
reqwest = { version = "0.12", features = ["json"] }
base64 = { version = "0.22", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# rt + macros only: `spawn_blocking` needs the runtime, `#[tokio::test]` the macro.
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
# Hermetic temp dirs for credential/auth-file tests (matches the workspace-wide
# `tempfile = "3"` used by sibling core crates).
tempfile = "3"
