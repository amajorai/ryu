[package]
name = "ryu-webauthn-relay"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Wire contract and validation for relaying a remote browser's WebAuthn ceremony to the user's own hardware security key."
repository = "https://github.com/amajorai/ryu"

[dependencies]
base64 = "0.22"
psl = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
url = "2"
