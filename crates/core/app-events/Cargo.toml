[package]
name = "ryu-app-events"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"
description = "The app-event emit client for Ryu sidecars: one dep-light helper that raises an event declared in an app's manifest `contributes.hook_events` through Core's `events.emit` host capability, so every plugin hook and workflow subscribed to it fires. The dispatch, authorization and fan-out all live Core-side; this crate holds only the outbound half an out-of-process sidecar needs, so it has ZERO dependency on apps/core."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so there is no version skew when a
# backend crate that Core also consumes in-process pulls this in.
[dependencies]
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.7", features = ["json"] }
