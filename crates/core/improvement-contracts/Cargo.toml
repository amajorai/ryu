[package]
name = "ryu-improvement-contracts"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure, versioned wire contracts for Ryu recursive-improvement runs, evidence, decisions, and rollback lineage."
repository = "https://github.com/amajorai/ryu"

# Keep this crate pure data. Core, Learning, Research, and host clients may
# depend on the contract, but the contract must not depend on a runtime, store,
# UI, provider, or sidecar implementation.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
