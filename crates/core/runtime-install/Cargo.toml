[package]
name = "ryu-runtime-install"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[features]
tokio-process = ["dep:tokio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sysinfo = { version = "0.33", features = ["system"] }
sha2 = "0.10"
fs4 = "0.8.4"
tokio = { version = "1", features = ["process", "rt", "time", "io-util"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_IO", "Win32_System_Ioctl"] }
