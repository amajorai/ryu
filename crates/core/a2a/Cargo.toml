[package]
name = "ryu-a2a"
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"
description = "A2A v1 protocol, trust, persistence, and transport-safety primitives for Ryu"
repository = "https://github.com/amajorai/ryu"

[dependencies]
a2a = { package = "a2a-lf", version = "=0.3.0" }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

ryu-crypto = { path = "../crypto", version = "0.2.5" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
