[package]
name = "ryu-output-styles"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Output styles: the `<name>.md` registry (frontmatter + body), the four-source merge (plugin / user / project / managed), the selection file, the system-prompt style block, user-root authoring, and the `/api/output-styles` CRUD surface — an extracted Core capability crate. In-process only. Core consumes it as a path dependency and injects the ryu data dir, so this crate has ZERO dependency on apps/core."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so the in-process nest into Core's
# axum router has no version skew. This crate has ZERO dependency on apps/core.
[dependencies]
# The data-dir layout (`db/`, `state/`, …) shared by every Ryu process.
ryu-sidecar-runtime = { path = "../sidecar-runtime", version = "0.5.0" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = { version = "0.0.58", default-features = false, features = ["std", "compat-serde-yaml"] }
tracing = "0.1"
dirs = "5"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
tempfile = "3"
