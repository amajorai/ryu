[package]
name = "ryu-vector-stores"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Pluggable vector stores for Ryu: one `VectorStore` trait (ensure_collection / upsert / query with a metadata filter / delete) with a local sqlite-vec implementation (the default) and REST/wire clients for Qdrant, Chroma (v2), Pinecone, Weaviate, Milvus (v2) and Postgres pgvector. An extracted Core capability crate with ZERO dependency on apps/core: Core resolves the provider, the data-dir path, and the credential reference (`apps/core/src/rag_host.rs`) and hands this crate plain config."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml so there is no version skew when
# Core links this crate in-process. This crate has ZERO dependency on apps/core.
[dependencies]
anyhow = "1"
async-trait = "0.1"
native-tls = "0.2"
postgres-native-tls = "0.5"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "=0.1.6"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tracing = "0.1"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
