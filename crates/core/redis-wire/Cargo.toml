[package]
name = "ryu-redis-wire"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal, binary-safe RESP2 client for Ryu's pluggable state stores: an incremental frame codec plus a small pooled async connection (plain TCP or TLS, AUTH + SELECT from a redis:// / rediss:// URL). Shared by the durable checkpoint store and the Gateway response/embedding caches so neither pulls a full Redis client crate. ZERO dependency on apps/core."
repository = "https://github.com/amajorai/ryu"

# Versions are matched to apps/core/Cargo.toml (which already speaks RESP for
# vault dynamic roles) so linking this crate adds no new registry crates.
[features]
default = ["tls"]
# `rediss://` / `valkeys://` URLs negotiate TLS against the platform trust store.
tls = ["dep:native-tls", "dep:tokio-native-tls"]
# `testing::FakeRedis`, an in-process RESP server for downstream unit tests.
testing = ["tokio/rt", "tokio/macros"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
url = "2"
urlencoding = "2"
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
